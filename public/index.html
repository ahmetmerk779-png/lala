<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MC Bot Kontrol</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkbg: '#090d16', cardbg: '#111827', cardborder: '#1f2937' } } }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        .log-font { font-family: monospace; font-size: 11px; }
        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; }
    </style>
</head>
<body class="bg-darkbg text-slate-200 min-h-screen p-3 text-xs flex flex-col justify-start">

    <!-- ÜST BİLGİ VE MENÜ -->
    <header class="bg-cardbg border border-cardborder rounded-xl p-3 mb-3 flex items-center justify-between shadow-lg">
        <div>
            <h1 class="font-bold text-white text-sm flex items-center gap-2">
                <i class="fa-solid fa-robot text-indigo-400"></i> PRO Dashboard
            </h1>
            <div class="text-[10px] text-slate-400 mt-0.5">
                <span id="serverInfo">play.donutsmp.net</span> • <span id="botCountBadge" class="text-emerald-400 font-bold">0 Bot</span>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="openConfigModal()" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center border border-slate-700">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button onclick="addBot()" class="px-3 py-1.5 bg-indigo-600 text-white font-bold rounded-lg flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> Bot
            </button>
        </div>
    </header>

    <!-- BOT SEÇİMİ VE DURUMU -->
    <div class="bg-cardbg border border-cardborder rounded-xl p-3 mb-3">
        <select id="botSelect" onchange="onBotSelectChange(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white font-bold text-xs mb-3">
            <option value="">-- Bot Ekleyin / Seçin --</option>
        </select>

        <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-lg border border-slate-800">
            <div class="flex items-center gap-2.5">
                <img id="botAvatar" src="https://minotar.net/helm/Steve/32.png" class="w-8 h-8 rounded border border-slate-700">
                <div>
                    <div class="font-bold text-white text-xs flex items-center gap-1.5">
                        <span id="selectedBotName">Bot Yok</span>
                        <span id="botStatusBadge" class="text-[9px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">OFFLINE</span>
                    </div>
                    <div class="text-[10px] text-slate-400 flex gap-3 mt-1">
                        <span>❤️ <b id="hpText" class="text-rose-400">20</b></span>
                        <span>🍖 <b id="foodText" class="text-amber-400">20</b></span>
                    </div>
                </div>
            </div>
            <div class="flex gap-1.5">
                <button onclick="startSelectedBot()" class="w-8 h-8 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-lg"><i class="fa-solid fa-play"></i></button>
                <button onclick="stopSelectedBot()" class="w-8 h-8 bg-rose-500/10 text-rose-400 border border-rose-500/30 rounded-lg"><i class="fa-solid fa-square"></i></button>
            </div>
        </div>
    </div>

    <!-- SEKMELER (TABS) -->
    <div class="flex gap-1 mb-2 bg-cardbg p-1 rounded-lg border border-cardborder">
        <button onclick="switchTab('konsol')" id="tab-btn-konsol" class="flex-1 py-1.5 rounded-md bg-indigo-600 text-white font-bold transition">Konsol</button>
        <button onclick="switchTab('radar')" id="tab-btn-radar" class="flex-1 py-1.5 rounded-md text-slate-400 hover:text-white transition">Radar</button>
        <button onclick="switchTab('ozellikler')" id="tab-btn-ozellikler" class="flex-1 py-1.5 rounded-md text-slate-400 hover:text-white transition">Özellikler</button>
    </div>

    <!-- 1. KONSOL SEKMESİ -->
    <div id="tab-konsol" class="tab-content active flex-1 bg-cardbg border border-cardborder rounded-xl p-3 min-h-[250px]">
        <div id="logBox" class="log-font flex-1 bg-slate-950 border border-slate-900 rounded-lg p-2.5 overflow-y-auto space-y-1.5 max-h-[300px]"></div>
        <div class="mt-2 flex gap-1.5">
            <input type="text" id="cmdInput" placeholder="Mesaj veya komut..." onkeypress="if(event.key==='Enter') sendCommand()" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white font-mono focus:outline-none focus:border-indigo-500">
            <button onclick="sendCommand()" class="px-4 bg-indigo-600 text-white rounded-lg"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- 2. RADAR SEKMESİ -->
    <div id="tab-radar" class="tab-content flex-1 bg-cardbg border border-cardborder rounded-xl p-3 min-h-[250px] items-center justify-center relative">
        <div class="absolute top-3 left-3 flex gap-4 text-xs font-mono font-bold bg-slate-900 p-2 rounded-lg border border-slate-800">
            <div class="text-rose-400">X: <span id="posX">0</span></div>
            <div class="text-emerald-400">Y: <span id="posY">0</span></div>
            <div class="text-blue-400">Z: <span id="posZ">0</span></div>
        </div>
        
        <!-- Basit Radar Görseli -->
        <div class="w-48 h-48 rounded-full border-2 border-emerald-500/30 bg-emerald-950/20 relative mt-8 flex items-center justify-center overflow-hidden">
            <div class="absolute w-full h-[1px] bg-emerald-500/20"></div>
            <div class="absolute h-full w-[1px] bg-emerald-500/20"></div>
            <!-- Botun Merkezdeki Konumu -->
            <div class="w-3 h-3 bg-emerald-400 rounded-full shadow-[0_0_10px_#34d399] z-10"></div>
            <!-- Radar Tarama Animasyonu -->
            <div class="absolute w-24 h-24 border-r-2 border-emerald-500/50 rounded-tl-full origin-bottom-right animate-[spin_2s_linear_infinite] opacity-50 bg-gradient-to-br from-transparent to-emerald-500/20" style="bottom: 50%; right: 50%;"></div>
        </div>
        <div class="text-center mt-4 text-[10px] text-slate-500">Radar botun anlık koordinatlarını gösterir.</div>
    </div>

    <!-- 3. ÖZELLİKLER SEKMESİ -->
    <div id="tab-ozellikler" class="tab-content flex-1 bg-cardbg border border-cardborder rounded-xl p-3 min-h-[250px]">
        <h3 class="text-slate-400 font-bold mb-3 border-b border-slate-800 pb-2">Bot Otomasyonları</h3>
        
        <div class="space-y-3">
            <label class="flex items-center justify-between p-3 bg-slate-900 rounded-lg border border-slate-800">
                <div>
                    <div class="text-white font-bold">Oto-Yeniden Bağlanma</div>
                    <div class="text-[10px] text-slate-400">Bot düşerse 5 saniye sonra tekrar girer.</div>
                </div>
                <input type="checkbox" id="toggleReconnect" onchange="updateBotSettings()" class="w-5 h-5 accent-indigo-500 rounded">
            </label>

            <label class="flex items-center justify-between p-3 bg-slate-900 rounded-lg border border-slate-800">
                <div>
                    <div class="text-white font-bold">Anti-AFK</div>
                    <div class="text-[10px] text-slate-400">Bot atılmamak için düzenli hareket eder.</div>
                </div>
                <input type="checkbox" id="toggleAntiAfk" onchange="updateBotSettings()" class="w-5 h-5 accent-indigo-500 rounded">
            </label>
        </div>
    </div>

    <!-- AYARLAR MODAL (Aynı Kaldı) -->
    <div id="configModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-cardbg rounded-xl max-w-sm w-full p-4 border border-slate-700">
            <h3 class="font-bold text-white mb-3">Sunucu Ayarları</h3>
            <div class="space-y-2 text-xs">
                <input type="text" id="globalHost" placeholder="Sunucu IP" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono">
                <div class="flex gap-2">
                    <input type="number" id="globalPort" placeholder="Port" class="w-1/2 bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono">
                    <input type="text" id="globalVersion" placeholder="Sürüm (1.20.4)" class="w-1/2 bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono">
                </div>
                <input type="text" id="globalSubCmd" placeholder="Oto komut (örn: /gir asmp)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono">
            </div>
            <div class="flex justify-end gap-2 mt-3">
                <button onclick="closeConfigModal()" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg">İptal</button>
                <button onclick="saveConfig()" class="px-4 py-1.5 bg-indigo-600 text-white rounded-lg">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let bots = [];
        let selectedBotId = null;

        // Sekme Değiştirme Mantığı
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            
            document.querySelectorAll('[id^="tab-btn-"]').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById('tab-btn-' + tabId);
            activeBtn.classList.remove('text-slate-400');
            activeBtn.classList.add('bg-indigo-600', 'text-white');
        }

        socket.on('init-data', (data) => {
            bots = data.botList || [];
            document.getElementById('globalHost').value = data.globalConfig.host;
            document.getElementById('globalPort').value = data.globalConfig.port;
            document.getElementById('globalVersion').value = data.globalConfig.version;
            document.getElementById('globalSubCmd').value = data.globalConfig.autoSubServerCmd;
            document.getElementById('serverInfo').innerText = data.globalConfig.host;

            if (bots.length > 0 && !selectedBotId) selectedBotId = bots[0].id;
            updateUI();
        });

        socket.on('bot-added', (bot) => {
            bots.push(bot);
            if (!selectedBotId) selectedBotId = bot.id;
            updateUI();
        });

        socket.on('status-update', (data) => {
            const bot = bots.find(b => b.id === data.botId);
            if (bot) {
                Object.assign(bot, data);
                if (selectedBotId === data.botId) updateSelectedBotCard();
                updateDropdown();
            }
        });

        socket.on('bot-map-update', ({ botId, pos }) => {
            const bot = bots.find(b => b.id === botId);
            if (bot) bot.pos = pos;
            if (selectedBotId === botId) {
                document.getElementById('posX').innerText = pos.x;
                document.getElementById('posY').innerText = pos.y;
                document.getElementById('posZ').innerText = pos.z;
            }
        });

        socket.on('bot-log', (log) => {
            if (selectedBotId === log.botId) appendLog(log);
        });

        function updateUI() {
            updateDropdown();
            updateSelectedBotCard();
        }

        function updateDropdown() {
            const select = document.getElementById('botSelect');
            document.getElementById('botCountBadge').innerText = `${bots.length} Bot`;
            if (bots.length === 0) { select.innerHTML = `<option value="">-- Bot Ekleyin --</option>`; return; }
            select.innerHTML = bots.map(b => `<option value="${b.id}" ${b.id === selectedBotId ? 'selected' : ''}>${b.username} (${b.status})</option>`).join('');
        }

        function onBotSelectChange(id) {
            selectedBotId = id;
            document.getElementById('logBox').innerHTML = '';
            const bot = bots.find(b => b.id === id);
            if (bot && bot.logs) bot.logs.forEach(appendLog);
            updateSelectedBotCard();
        }

        function updateSelectedBotCard() {
            const bot = bots.find(b => b.id === selectedBotId);
            if (!bot) return;

            document.getElementById('selectedBotName').innerText = bot.username;
            document.getElementById('botAvatar').src = `https://minotar.net/helm/${bot.username}/32.png`;
            document.getElementById('hpText').innerText = bot.health ?? 20;
            document.getElementById('foodText').innerText = bot.food ?? 20;
            
            // Koordinatları güncelle
            if (bot.pos) {
                document.getElementById('posX').innerText = bot.pos.x;
                document.getElementById('posY').innerText = bot.pos.y;
                document.getElementById('posZ').innerText = bot.pos.z;
            } else {
                document.getElementById('posX').innerText = 0; document.getElementById('posY').innerText = 0; document.getElementById('posZ').innerText = 0;
            }

            // Ayarlar sekmesindeki tikleri güncelle
            document.getElementById('toggleReconnect').checked = bot.autoReconnect;
            document.getElementById('toggleAntiAfk').checked = bot.antiAfk;

            const badge = document.getElementById('botStatusBadge');
            badge.innerText = bot.status.toUpperCase();
            if (bot.status === 'Online') badge.className = 'text-[9px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400';
            else if (bot.status === 'Connecting') badge.className = 'text-[9px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400';
            else badge.className = 'text-[9px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400';
        }

        function appendLog(log) {
            const box = document.getElementById('logBox');
            let color = 'text-slate-300';
            if(log.type === 'error') color = 'text-rose-400';
            if(log.type === 'system') color = 'text-amber-400';
            box.innerHTML += `<div class="${color} border-b border-slate-900/50 pb-0.5"><span class="text-slate-600">[${log.timestamp}]</span> ${log.text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function updateBotSettings() {
            if (!selectedBotId) return;
            const config = {
                autoReconnect: document.getElementById('toggleReconnect').checked,
                antiAfk: document.getElementById('toggleAntiAfk').checked
            };
            socket.emit('update-bot-config', { botId: selectedBotId, config });
            
            // Yerel veriyi güncelle
            const bot = bots.find(b => b.id === selectedBotId);
            if(bot) Object.assign(bot, config);
        }

        function addBot() { const name = prompt('Kullanıcı Adı:'); if (name) socket.emit('add-bot', { username: name.trim() }); }
        function startSelectedBot() { if (selectedBotId) socket.emit('start-bot', selectedBotId); }
        function stopSelectedBot() { if (selectedBotId) socket.emit('stop-bot', selectedBotId); }
        
        function sendCommand() {
            const input = document.getElementById('cmdInput');
            if (input.value.trim() && selectedBotId) {
                socket.emit('send-command', { targetBotId: selectedBotId, command: input.value.trim() });
                input.value = '';
            }
        }

        function openConfigModal() { document.getElementById('configModal').classList.remove('hidden'); }
        function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }
        function saveConfig() {
            socket.emit('update-config', {
                host: document.getElementById('globalHost').value,
                port: Number(document.getElementById('globalPort').value),
                version: document.getElementById('globalVersion').value,
                autoSubServerCmd: document.getElementById('globalSubCmd').value
            });
            closeConfigModal();
        }
    </script>
</body>
</html>
