<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Bot Panel - Solid Gamer Theme</title>
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- YENİ FONTLAR: Poppins (Arayüz) ve JetBrains Mono (Veri/Kod) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- KATI (SOLID) VE YÜKSEK KONTRASTLI RENK PALETİ --- */
        :root {
            --bg-body: #05070a;        /* En arka plan mat siyah */
            --bg-card: #0d121a;        /* Kartlar için koyu mat */
            --bg-inner: #151b26;       /* Kart içi bileşenler */
            --bg-input: #080b10;       /* Input arka planı */
            
            --border-color: #202b3d;   /* Keskin sınır çizgileri */
            --border-hover: #334563;
            
            --accent-primary: #3b82f6; /* Canlı Mavi */
            --accent-hover: #2563eb;
            
            --neon-green: #00ffa3;     /* Online / Başarı */
            --neon-red: #ff3366;       /* Offline / Hata / Düşman */
            --neon-gold: #fbbf24;      /* Uyarı / Puan */
            --neon-cyan: #0ea5e9;      /* Bilgi / Koordinat */
            
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        /* --- GENEL AYARLAR --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 15px;
            font-size: 14px;
        }

        /* --- ÖZEL SCROLLBAR (Oyuncu Tarzı) --- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-inner); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- KART TASARIMLARI (Mat ve Keskin) --- */
        .header, .card, .bot-card, .modal {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 8px; /* Daha keskin köşeler */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card { padding: 18px; }

        .card-header {
            font-size: 13px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-inner);
            padding-bottom: 8px;
        }

        /* --- FORM VE İNPUTLAR --- */
        .form-group { display: flex; gap: 8px; }

        input, select {
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace; /* Input içini kod fontu yapalım, havalı durur */
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-primary);
        }

        /* --- BUTONLAR (Katı ve Neon Vurgulu) --- */
        button {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            color: #fff;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active { transform: scale(0.96); }

        .btn-primary { background: var(--accent-primary); }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); }

        .btn-success { background: #059669; }
        .btn-success:hover { background: #10b981; box-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }

        .btn-warning { background: #d97706; }
        .btn-warning:hover { background: #f59e0b; box-shadow: 0 0 12px rgba(245, 158, 11, 0.4); }

        .btn-danger { background: #be123c; }
        .btn-danger:hover { background: #e11d48; box-shadow: 0 0 12px rgba(225, 29, 72, 0.4); }

        .btn-secondary { background: var(--border-color); color: var(--text-main); }
        .btn-secondary:hover { background: var(--border-hover); }

        /* --- BOT KARTI DETAYLARI --- */
        .bot-card {
            padding: 16px;
            margin-bottom: 16px;
            background: #0d121a;
            border-left: 4px solid var(--border-color);
        }

        .bot-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bot-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .bot-name { font-weight: 800; font-size: 16px; color: #ffffff; letter-spacing: 0.5px; }

        .bot-details-bar {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-inner);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .bot-details-bar b { color: var(--text-main); font-weight: 700; }

        /* --- BADGELER (Rozetler) --- */
        .badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
        }
        
        .badge-Online { background: #064e3b; color: var(--neon-green); border: 1px solid #047857; }
        .badge-Offline { background: #4c0519; color: var(--neon-red); border: 1px solid #881337; }
        .badge-Connecting { background: #451a03; color: var(--neon-gold); border: 1px solid #78350f; }

        .coords-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            color: var(--neon-cyan);
            background: #082f49;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #0c4a6e;
        }

        /* --- LOG KUTUSU (Terminal Tarzı) --- */
        .log-box {
            background: #000000;
            border: 2px solid var(--bg-inner);
            border-left: 2px solid var(--border-color);
            height: 120px;
            overflow-y: auto;
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            border-radius: 6px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .log-line { margin-bottom: 4px; word-break: break-all; }
        .log-info { color: var(--neon-cyan); }
        .log-success { color: var(--neon-green); }
        .log-warn { color: var(--neon-gold); }
        .log-error { color: var(--neon-red); font-weight: 700; }
        .log-chat { color: #d946ef; }
        .log-command { color: #a7f3d0; font-weight: bold; }

        /* --- ENVANTER (Mat Minecraft UI) --- */
        .inventory-wrapper {
            background: var(--bg-inner);
            border: 2px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .inventory-header { margin-bottom: 10px; }
        .inventory-title { font-size: 13px; color: var(--text-main); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .inventory-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
        .armor-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
            margin-bottom: 10px; padding-bottom: 10px; border-bottom: 2px solid var(--bg-card);
        }

        .inv-slot {
            background: var(--bg-input);
            border: 2px solid var(--bg-card);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s, border-color 0.2s;
        }

        .inv-slot:hover { border-color: var(--text-muted); }

        .inv-slot.has-item { background: #1e293b; border-color: #3b82f6; }
        .inv-slot.has-item:hover { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(14, 165, 233, 0.3); }

        .inv-slot img { width: 28px; height: 28px; image-rendering: pixelated; object-fit: contain; pointer-events: none; }
        
        .inv-slot-count {
            position: absolute; bottom: 2px; right: 4px;
            color: #ffffff; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 11px;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            pointer-events: none;
        }

        .inv-slot-id { opacity: 0.3; font-size: 10px; font-weight: 700; color: var(--text-muted); pointer-events: none; }

        .inv-info-bar {
            margin-top: 10px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-main);
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* --- WIDGET IZGARASI (Radar, Tablist, Scoreboard) --- */
        .bot-widgets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
        }

        .radar-box, .tablist-box, .scoreboard-box {
            background: var(--bg-inner);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .radar-title, .tablist-title, .scoreboard-title {
            font-size: 13px;
            color: var(--text-main);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-card);
            padding-bottom: 6px;
        }

        .scoreboard-title { color: var(--neon-gold); text-align: center; justify-content: center; }

        /* RADAR */
        .radar-box { align-items: center; }
        .radar-canvas {
            background: #000000;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            width: 100%;
            max-width: 220px;
            height: 220px;
            cursor: crosshair;
        }
        .radar-tooltip {
            margin-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
            font-weight: 700; color: var(--neon-cyan); min-height: 16px; text-align: center;
        }

        /* TABLIST */
        .tablist-container { max-height: 190px; overflow-y: auto; padding-right: 4px; }
        .tablist-table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }
        .tablist-table th { text-align: left; color: var(--text-muted); padding: 6px; border-bottom: 2px solid var(--bg-card); font-size: 10px; text-transform: uppercase; }
        .tablist-table td { padding: 6px; border-bottom: 1px solid var(--bg-card); color: var(--text-main); font-weight: 600; }

        /* SCOREBOARD */
        .scoreboard-box { font-family: 'JetBrains Mono', monospace; }
        .scoreboard-line {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 5px; font-size: 12px; font-weight: 600;
            background: var(--bg-card); padding: 4px 8px; border-radius: 4px;
        }

        /* --- MODAL (Açılır Pencereler) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); /* Blur yok, keskin karartma */
            display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 15px;
        }

        .modal {
            width: 100%; max-width: 420px;
            padding: 20px; display: flex; flex-direction: column; gap: 14px;
        }
        
        .modal-title { font-size: 16px; font-weight: 800; color: #fff; border-bottom: 2px solid var(--bg-inner); padding-bottom: 10px; margin-bottom: 5px; }
        
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🤖 MC Bot Manager</h1>
        <button class="btn-secondary" onclick="openGlobalSettings()">⚙️ Genel Ayarlar</button>
    </div>

    <div class="card">
        <div class="card-header">💬 Konsol & Komut Gönderimi</div>
        <div class="form-group">
            <select id="targetBotSelect" style="max-width: 140px;">
                <option value="all">Tüm Botlar</option>
            </select>
            <input type="text" id="globalCmdInput" placeholder="Komut yazın (/afk, /login...)" style="flex: 1;">
            <button class="btn-primary" onclick="sendGlobalCommand()">Gönder</button>
        </div>
    </div>

    <div class="card">
        <div class="card-header">➕ Bot Yönetimi</div>
        <div class="form-group" style="margin-bottom: 12px;">
            <input type="text" id="newBotUsername" placeholder="Yeni Bot Kullanıcı Adı" style="flex: 1;">
            <button class="btn-success" onclick="addBot()">Ekle</button>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-success" style="flex: 1;" onclick="socket.emit('start-all')">⚡ Tümünü Başlat</button>
            <button class="btn-danger" style="flex: 1;" onclick="socket.emit('stop-all')">🛑 Tümünü Durdur</button>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span>📋 Aktif Bot Listesi</span>
            <span id="botCountBadge" style="font-size: 11px; background: var(--bg-inner); padding: 4px 10px; border-radius: 4px; color: var(--neon-cyan); border: 1px solid var(--border-color);">Toplam Bot: 0</span>
        </div>
        <div id="botListContainer"></div>
    </div>
</div>

<div class="modal-overlay" id="botSettingsModal">
    <div class="modal">
        <div class="modal-title">⚙️ Bot Ayarları (<span id="modalBotName" style="color:var(--neon-cyan);"></span>)</div>
        <input type="hidden" id="modalBotId">
        <div class="field"><label>Sunucu IP</label><input type="text" id="modalHost"></div>
        <div class="field"><label>Port</label><input type="number" id="modalPort"></div>
        <div class="field"><label>Versiyon</label><input type="text" id="modalVersion"></div>
        <div class="field"><label>Şifre (/login)</label><input type="text" id="modalPassword"></div>
        <div class="field"><label>Alt Sunucu Komutu</label><input type="text" id="modalSubCmd"></div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn-primary" style="flex: 1;" onclick="saveBotSettings()">Kaydet</button>
            <button class="btn-secondary" style="flex: 1;" onclick="closeModal('botSettingsModal')">İptal</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="globalSettingsModal">
    <div class="modal">
        <div class="modal-title">🌐 Genel Varsayılan Ayarlar</div>
        <div class="field"><label>IP</label><input type="text" id="gModalHost"></div>
        <div class="field"><label>Port</label><input type="number" id="gModalPort"></div>
        <div class="field"><label>Versiyon</label><input type="text" id="gModalVersion"></div>
        <div class="field"><label>Şifre</label><input type="text" id="gModalPassword"></div>
        <div class="field"><label>Alt Sunucu Komutu</label><input type="text" id="gModalSubCmd"></div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn-primary" style="flex: 1;" onclick="saveGlobalSettings()">Kaydet</button>
            <button class="btn-secondary" style="flex: 1;" onclick="closeModal('globalSettingsModal')">Kapat</button>
        </div>
    </div>
</div>

<!-- JAVASCRIPT KISMI BİREBİR AYNI -->
<script>
    const socket = io();
    let botsMap = new Map();
    let globalConfig = {};

    const radarEntitiesMap = new Map();

    setInterval(() => {
        botsMap.forEach((bot, botId) => {
            if (bot.status === 'Online' && bot.onlineSince) {
                const diffSec = Math.floor((Date.now() - bot.onlineSince) / 1000);
                const h = Math.floor(diffSec / 3600);
                const m = Math.floor((diffSec % 3600) / 60);
                const s = diffSec % 60;
                const timeStr = `${h > 0 ? h + 's ' : ''}${m}dk ${s}sn`;
                const uptimeEl = document.getElementById(`uptime-${botId}`);
                if (uptimeEl) uptimeEl.innerText = `⏱️ Süre: ${timeStr}`;
            }
        });
    }, 1000);

    socket.on('init-data', (data) => {
        botsMap.clear();
        globalConfig = data.globalConfig || {};
        data.botList.forEach(bot => botsMap.set(bot.id, bot));
        renderBotList();
    });

    socket.on('bot-added', (bot) => {
        botsMap.set(bot.id, bot);
        renderBotList();
    });

    socket.on('bot-deleted', (botId) => {
        botsMap.delete(botId);
        renderBotList();
    });

    socket.on('bot-updated', ({ botId, config }) => {
        if (botsMap.has(botId)) {
            Object.assign(botsMap.get(botId), config);
            renderBotList();
        }
    });

    socket.on('config-updated', (cfg) => { globalConfig = cfg; });

    socket.on('status-update', ({ botId, status, onlineSince }) => {
        if (botsMap.has(botId)) {
            const bot = botsMap.get(botId);
            bot.status = status;
            bot.onlineSince = onlineSince;
            
            const badge = document.getElementById(`badge-${botId}`);
            if (badge) {
                badge.innerText = status;
                badge.className = `badge badge-${status}`;
                
                // Solid temaya özel border rengi güncellemesi (opsiyonel ama şık)
                if(status === 'Online') document.getElementById(`card-${botId}`).style.borderLeftColor = 'var(--neon-green)';
                else if(status === 'Offline') document.getElementById(`card-${botId}`).style.borderLeftColor = 'var(--neon-red)';
                else document.getElementById(`card-${botId}`).style.borderLeftColor = 'var(--neon-gold)';
            }
            if (status === 'Offline') {
                const uptimeEl = document.getElementById(`uptime-${botId}`);
                if (uptimeEl) uptimeEl.innerText = `⏱️ Çevrimdışı`;
            }
        }
    });

    socket.on('bot-log', (log) => {
        if (botsMap.has(log.botId)) {
            const bot = botsMap.get(log.botId);
            bot.logs.push(log);
            if (bot.logs.length > 30) bot.logs.shift(); // Biraz daha fazla log tutsun

            const logBox = document.getElementById(`logs-${log.botId}`);
            if (logBox) {
                const div = document.createElement('div');
                div.className = `log-line log-${log.type}`;
                div.innerText = `[${log.timestamp}] ${log.text}`;
                logBox.appendChild(div);
                logBox.scrollTop = logBox.scrollHeight;
            }
        }
    });

    socket.on('bot-inventory', ({ botId, inventory }) => {
        if (botsMap.has(botId)) {
            botsMap.get(botId).inventory = inventory;
            renderInventoryGrid(botId, inventory);
        }
    });

    socket.on('bot-map-update', ({ botId, pos, entities }) => {
        if (botsMap.has(botId)) {
            const bot = botsMap.get(botId);
            bot.pos = pos;
            bot.entities = entities;

            const coordsEl = document.getElementById(`coords-${botId}`);
            if (coordsEl) {
                coordsEl.innerText = `📍 X: ${pos.x} | Y: ${pos.y} | Z: ${pos.z}`;
            }
            drawRadar(botId, pos, entities);
        }
    });

    socket.on('bot-tablist', ({ botId, players }) => {
        if (botsMap.has(botId)) {
            const bot = botsMap.get(botId);
            bot.tabList = players;
            renderTabList(botId, players);
        }
    });

    socket.on('bot-scoreboard', ({ botId, scoreboard }) => {
        const titleEl = document.getElementById(`sb-title-${botId}`);
        const linesEl = document.getElementById(`sb-lines-${botId}`);
        if (!linesEl) return;

        if (!scoreboard || !scoreboard.lines || scoreboard.lines.length === 0) {
            if (titleEl) titleEl.innerText = '📊 SCOREBOARD';
            linesEl.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 4px;">Aktif Scoreboard yok</div>`;
            return;
        }

        if (titleEl && scoreboard.title) titleEl.innerText = `📊 ${scoreboard.title}`;
        linesEl.innerHTML = '';
        scoreboard.lines.forEach(item => {
            const row = document.createElement('div');
            row.className = 'scoreboard-line';
            row.innerHTML = `<span style="color:var(--text-main)">${item.text}</span><span style="color:var(--neon-red); font-weight:800;">${item.score}</span>`;
            linesEl.appendChild(row);
        });
    });

    function renderBotList() {
        const container = document.getElementById('botListContainer');
        const select = document.getElementById('targetBotSelect');
        const countBadge = document.getElementById('botCountBadge');
        
        container.innerHTML = '';
        select.innerHTML = '<option value="all">Tüm Botlar</option>';
        if (countBadge) countBadge.innerText = `Toplam Bot: ${botsMap.size}`;

        botsMap.forEach((bot) => {
            const opt = document.createElement('option');
            opt.value = bot.id;
            opt.innerText = bot.username;
            select.appendChild(opt);

            const pos = bot.pos || { x: 0, y: 0, z: 0 };
            const botHost = bot.host || globalConfig.host || 'Bilinmiyor';
            const botPort = bot.port || globalConfig.port || 25565;
            const botPassword = bot.autoPassword !== undefined && bot.autoPassword !== '' ? bot.autoPassword : (globalConfig.autoPassword || 'Yok');

            // Başlangıç border rengi
            let borderColor = 'var(--border-color)';
            if(bot.status === 'Online') borderColor = 'var(--neon-green)';
            if(bot.status === 'Offline') borderColor = 'var(--neon-red)';

            const card = document.createElement('div');
            card.className = 'bot-card';
            card.id = `card-${bot.id}`;
            card.style.borderLeftColor = borderColor;
            
            card.innerHTML = `
                <div class="bot-top">
                    <div class="bot-title">
                        <span class="bot-name">${bot.username}</span>
                        <span id="badge-${bot.id}" class="badge badge-${bot.status}">${bot.status}</span>
                        <span class="coords-badge" id="coords-${bot.id}">📍 X: ${pos.x} | Y: ${pos.y} | Z: ${pos.z}</span>
                    </div>
                    <div class="bot-actions" style="display:flex; gap:6px;">
                        <button class="btn-success" onclick="socket.emit('start-bot', '${bot.id}')">BAŞLAT</button>
                        <button class="btn-warning" onclick="socket.emit('stop-bot', '${bot.id}')">DURDUR</button>
                        <button class="btn-secondary" onclick="openBotSettings('${bot.id}')">⚙</button>
                        <button class="btn-danger" onclick="socket.emit('delete-bot', '${bot.id}')">X</button>
                    </div>
                </div>

                <div class="bot-details-bar">
                    <span>🌐 IP: <b>${botHost}:${botPort}</b></span>
                    <span>🔑 Şifre: <b>${botPassword}</b></span>
                    <span id="uptime-${bot.id}" style="color: var(--neon-cyan);">⏱️ Çevrimdışı</span>
                </div>

                <div class="log-box" id="logs-${bot.id}">
                    ${(bot.logs || []).map(l => `<div class="log-line log-${l.type}">[${l.timestamp}]${l.text}</div>`).join('')}
                </div>

                <div class="form-group" style="margin-bottom: 12px;">
                    <input type="text" id="cmd-${bot.id}" placeholder="Özel komut gönder..." style="flex: 1;">
                    <button class="btn-primary" onclick="sendSingleCommand('${bot.id}')">GÖNDER</button>
                </div>

                <div class="inventory-wrapper">
                    <div class="inventory-header">
                        <div class="inventory-title">🎒 Envanter Görünümü</div>
                    </div>
                    <div class="armor-grid" id="armor-grid-${bot.id}"></div>
                    <div class="inventory-grid" id="inv-grid-${bot.id}"></div>
                    <div class="inv-info-bar" id="inv-info-${bot.id}">
                        <span style="color:var(--text-muted);">Detayları görmek için eşyaya dokunun</span>
                    </div>
                </div>

                <div class="bot-widgets-grid">
                    <div class="radar-box">
                        <div class="radar-title">
                            <span>🗺️️ 2D Radar</span>
                            <span style="font-size:10px; color:var(--text-muted); font-family:'Poppins', sans-serif;">(Tıkla)</span>
                        </div>
                        <canvas id="map-canvas-${bot.id}" class="radar-canvas" width="220" height="220"></canvas>
                        <div class="radar-tooltip" id="radar-tip-${bot.id}">Noktaya tıklayın</div>
                    </div>

                    <div class="tablist-box">
                        <div class="tablist-title">
                            <span>📋 TAB LİSTESİ</span>
                            <span style="font-size:11px; color:var(--neon-cyan); font-family:'JetBrains Mono', monospace;" id="tab-count-${bot.id}">0 Oyuncu</span>
                        </div>
                        <div class="tablist-container">
                            <table class="tablist-table">
                                <thead>
                                    <tr>
                                        <th>Oyuncu</th>
                                        <th style="text-align: right;">Ping</th>
                                    </tr>
                                </thead>
                                <tbody id="tab-body-${bot.id}">
                                    <tr><td colspan="2" style="text-align:center; color:var(--text-muted); padding:8px;">Veri bekleniyor...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="scoreboard-box">
                        <div class="scoreboard-title" id="sb-title-${bot.id}">📊 SCOREBOARD</div>
                        <div id="sb-lines-${bot.id}">
                            <div style="color: var(--text-muted); text-align: center;">Skor bekleniyor...</div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);

            renderInventoryGrid(bot.id, bot.inventory || {});
            drawRadar(bot.id, pos, bot.entities || []);
            renderTabList(bot.id, bot.tabList || []);

            const lb = document.getElementById(`logs-${bot.id}`);
            if (lb) lb.scrollTop = lb.scrollHeight;
        });
    }

    function drawRadar(botId, pos, entities) {
        const canvas = document.getElementById(`map-canvas-${botId}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const scale = 3;

        ctx.fillStyle = '#000000'; // Tam Siyah
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = '#202b3d';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
        ctx.moveTo(0, cy); ctx.lineTo(w, cy);
        ctx.stroke();

        const entityCoordsMap = new Map();
        if (!radarEntitiesMap.has(botId)) radarEntitiesMap.set(botId, new Map());
        const currentBotRadarMap = radarEntitiesMap.get(botId);
        currentBotRadarMap.clear();

        const botObj = botsMap.get(botId);
        const tabPlayers = botObj && Array.isArray(botObj.tabList) ? botObj.tabList : [];

        if (Array.isArray(entities)) {
            entities.forEach(ent => {
                const dx = (ent.x - pos.x) * scale;
                const dz = (ent.z - pos.z) * scale;
                const rx = cx + dx;
                const ry = cy + dz;

                if (rx >= 0 && rx <= w && ry >= 0 && ry <= h) {
                    let displayName = ent.name || `Varlık #${ent.id}`;
                    
                    if (tabPlayers.length > 0) {
                        const matchedPlayer = tabPlayers.find(p => p.name && (displayName.includes(p.name) || p.name.includes(ent.id)));
                        if (matchedPlayer) {
                            displayName = matchedPlayer.displayName || matchedPlayer.name;
                        }
                    }

                    currentBotRadarMap.set(`${Math.round(rx)}_${Math.round(ry)}`, displayName);
                    
                    ctx.fillStyle = '#ff3366'; // Neon Kırmızı
                    ctx.beginPath();
                    ctx.arc(rx, ry, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        ctx.fillStyle = '#00ffa3'; // Neon Yeşil
        ctx.beginPath();
        ctx.arc(cx, cy, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        canvas.onclick = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            const tipEl = document.getElementById(`radar-tip-${botId}`);

            let foundName = null;
            let minDist = 999;

            currentBotRadarMap.forEach((name, key) => {
                const [ex, ey] = key.split('_').map(Number);
                const dist = Math.hypot(ex - clickX, ey - clickY);
                if (dist < 14 && dist < minDist) {
                    minDist = dist;
                    foundName = name;
                }
            });

            if (tipEl) {
                if (foundName) {
                    tipEl.innerHTML = `👤 OYUNCU: <span style="color:#ffffff">${foundName}</span>`;
                    tipEl.style.color = 'var(--neon-green)';
                } else {
                    tipEl.innerText = `KOORDİNAT: X:${pos.x}, Z:${pos.z}`;
                    tipEl.style.color = 'var(--neon-cyan)';
                }
            }
        };
    }

    function renderTabList(botId, players) {
        const tbody = document.getElementById(`tab-body-${botId}`);
        const countEl = document.getElementById(`tab-count-${botId}`);
        if (!tbody) return;

        if (countEl) countEl.innerText = `${players ? players.length : 0} Oyuncu`;
        tbody.innerHTML = '';

        if (!players || players.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:var(--text-muted); padding:8px;">Tab listesi boş</td></tr>`;
            return;
        }

        players.forEach(p => {
            const tr = document.createElement('tr');
            const name = p.displayName || p.name || 'Bilinmeyen';
            const ping = p.ping !== undefined ? `${p.ping}ms` : '-';
            
            let pingColor = 'var(--neon-green)';
            if (p.ping > 150) pingColor = 'var(--neon-gold)';
            if (p.ping > 300) pingColor = 'var(--neon-red)';

            tr.innerHTML = `
                <td>${name}</td>
                <td style="text-align: right; color: ${pingColor};">${ping}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function getItemImageUrl(itemName) {
        if (!itemName || itemName === 'unknown') return null;
        return `https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/${itemName}.png`;
    }

    function getBlockImageUrl(itemName) {
        return `https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/${itemName}.png`;
    }

    function renderInventoryGrid(botId, inventory) {
        const grid = document.getElementById(`inv-grid-${botId}`);
        const armorGrid = document.getElementById(`armor-grid-${botId}`);
        if (!grid || !armorGrid) return;

        grid.innerHTML = '';
        armorGrid.innerHTML = '';

        const armorSlots = [
            { slotId: 5, label: 'Kask' },
            { slotId: 6, label: 'Göğüs' },
            { slotId: 7, label: 'Pant' },
            { slotId: 8, label: 'Bot' },
            { slotId: 45, label: 'S. El' }
        ];

        armorSlots.forEach(arm => {
            const item = inventory[arm.slotId];
            armorGrid.appendChild(createSlotElement(botId, arm.slotId, item, arm.label));
        });

        for (let i = 9; i <= 44; i++) {
            const item = inventory[i];
            grid.appendChild(createSlotElement(botId, i, item));
        }
    }

    function createSlotElement(botId, slotIndex, item, placeholderText = null) {
        const slot = document.createElement('div');
        if (item) {
            slot.className = 'inv-slot has-item';
            const itemImg = getItemImageUrl(item.name);
            const blockImg = getBlockImageUrl(item.name);
            slot.innerHTML = `
                <img src="${itemImg}" onerror="if(this.src!=='${blockImg}'){this.src='${blockImg}';}else{this.style.display='none';}" alt="${item.displayName}">
                <span class="inv-slot-count">${item.count > 1 ? item.count : ''}</span>
            `;
            slot.onclick = () => selectItem(botId, item.displayName, item.count, slotIndex);
        } else {
            slot.className = 'inv-slot';
            slot.innerHTML = `<span class="inv-slot-id">${placeholderText ? placeholderText : slotIndex}</span>`;
            slot.onclick = () => selectItem(botId, 'Boş Slot', 0, slotIndex);
        }
        return slot;
    }

    function selectItem(botId, name, count, slot) {
        const infoBar = document.getElementById(`inv-info-${botId}`);
        if (!infoBar) return;
        if (count > 0) {
            infoBar.innerHTML = `<span style="color: var(--neon-cyan); font-weight:800; text-transform:uppercase;">📦 ${name}</span><span style="color: var(--text-main); font-size:11px;">Adet: <b>${count}</b> | Slot: ${slot}</span>`;
        } else {
            infoBar.innerHTML = `<span style="color: var(--text-muted);">Boş Slot (${slot})</span>`;
        }
    }

    function openBotSettings(botId) {
        const bot = botsMap.get(botId);
        if (!bot) return;
        document.getElementById('modalBotId').value = bot.id;
        document.getElementById('modalBotName').innerText = bot.username;
        document.getElementById('modalHost').value = bot.host || globalConfig.host || '';
        document.getElementById('modalPort').value = bot.port || globalConfig.port || 25565;
        document.getElementById('modalVersion').value = bot.version || globalConfig.version || '';
        document.getElementById('modalPassword').value = bot.autoPassword !== undefined ? bot.autoPassword : (globalConfig.autoPassword || '');
        document.getElementById('modalSubCmd').value = bot.autoSubServerCmd !== undefined ? bot.autoSubServerCmd : (globalConfig.autoSubServerCmd || '');
        document.getElementById('botSettingsModal').style.display = 'flex';
    }

    function saveBotSettings() {
        const botId = document.getElementById('modalBotId').value;
        const config = {
            host: document.getElementById('modalHost').value.trim(),
            port: Number(document.getElementById('modalPort').value),
            version: document.getElementById('modalVersion').value.trim(),
            autoPassword: document.getElementById('modalPassword').value.trim(),
            autoSubServerCmd: document.getElementById('modalSubCmd').value.trim()
        };
        socket.emit('update-bot-config', { botId, config });
        closeModal('botSettingsModal');
    }

    function openGlobalSettings() {
        document.getElementById('gModalHost').value = globalConfig.host || '';
        document.getElementById('gModalPort').value = globalConfig.port || 25565;
        document.getElementById('gModalVersion').value = globalConfig.version || '';
        document.getElementById('gModalPassword').value = globalConfig.autoPassword || '';
        document.getElementById('gModalSubCmd').value = globalConfig.autoSubServerCmd || '';
        document.getElementById('globalSettingsModal').style.display = 'flex';
    }

    function saveGlobalSettings() {
        const newConfig = {
            host: document.getElementById('gModalHost').value.trim(),
            port: Number(document.getElementById('gModalPort').value),
            version: document.getElementById('gModalVersion').value.trim(),
            autoPassword: document.getElementById('gModalPassword').value.trim() || '',
            autoSubServerCmd: document.getElementById('gModalSubCmd').value.trim()
        };
        socket.emit('update-config', newConfig);
        closeModal('globalSettingsModal');
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function addBot() {
        const input = document.getElementById('newBotUsername');
        if (input.value.trim()) {
            socket.emit('add-bot', { username: input.value.trim() });
            input.value = '';
        }
    }

    function sendGlobalCommand() {
        const target = document.getElementById('targetBotSelect').value;
        const cmd = document.getElementById('globalCmdInput').value;
        if (cmd.trim()) {
            socket.emit('send-command', { targetBotId: target, command: cmd.trim() });
            document.getElementById('globalCmdInput').value = '';
        }
    }

    function sendSingleCommand(botId) {
        const input = document.getElementById(`cmd-${botId}`);
        if (input && input.value.trim()) {
            socket.emit('send-command', { targetBotId: botId, command: input.value.trim() });
            input.value = '';
        }
    }
</script>
</body>
</html>
