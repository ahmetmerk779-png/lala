<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Çoklu Bot & Otomasyon Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-dark-red: #991b1b;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-yellow: #eab308;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 15px; }

        .container { max-width: 1250px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .main-grid { display: grid; grid-template-columns: 360px 1fr; gap: 15px; }
        @media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }

        .panel { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
        .panel-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; color: var(--accent-blue); }

        /* Form Elemanları */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
        
        .input-text { background: #050b14; border: 1px solid var(--border-color); color: #fff; padding: 8px; border-radius: 6px; outline: none; font-size: 0.85rem; }
        .input-text:focus { border-color: var(--accent-blue); }
        .input-select { background: #050b14; border: 1px solid var(--border-color); color: #fff; padding: 8px; border-radius: 6px; font-size: 0.85rem; }

        /* Butonlar */
        .btn { border: none; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; color: #fff; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-green { background-color: var(--accent-green); }
        .btn-red { background-color: var(--accent-red); }
        .btn-dark-red { background-color: var(--accent-dark-red); }
        .btn-blue { background-color: var(--accent-blue); }
        .btn-purple { background-color: var(--accent-purple); }

        /* Bot Listesi */
        .global-actions { display: flex; gap: 8px; margin-bottom: 12px; }
        .bot-list { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; }
        .bot-item { background: #0f172a; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; }
        .bot-info { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); }
        .status-dot.Online { background: var(--accent-green); }
        .status-dot.Connecting { background: var(--accent-yellow); }
        .status-dot.Offline { background: var(--accent-red); }

        .action-btns { display: flex; gap: 5px; }

        /* Konsol */
        .console-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .console-box { background-color: #050b14; border: 1px solid var(--border-color); border-radius: 6px; height: 430px; overflow-y: auto; padding: 12px; font-family: 'Courier New', Courier, monospace; font-size: 0.85rem; line-height: 1.4; }
        .log-entry { margin-bottom: 4px; word-break: break-word; }
        .log-time { color: var(--text-muted); margin-right: 5px; font-size: 0.75rem; }
        .log-tag { font-weight: bold; color: var(--accent-blue); margin-right: 5px; }

        .command-bar { display: flex; gap: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">

        <!-- UST PANEL: Sunucu & Otomasyon Ayarları -->
        <div class="panel">
            <div class="panel-title">
                <span>⚙️ Sunucu & Otomasyon Ayarları</span>
                <button class="btn btn-blue" onclick="saveConfig()">💾 Ayarları Kaydet</button>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Sunucu IP / Host</label>
                    <input type="text" id="cfgHost" class="input-text" placeholder="141.95.82.164">
                </div>
                <div class="form-group">
                    <label>Port</label>
                    <input type="number" id="cfgPort" class="input-text" placeholder="25565">
                </div>
                <div class="form-group">
                    <label>Minecraft Sürümü</label>
                    <input type="text" id="cfgVersion" class="input-text" placeholder="1.20.1">
                </div>
                <div class="form-group">
                    <label>Oto Register/Login Şifresi</label>
                    <input type="text" id="cfgPassword" class="input-text" placeholder="Sifre123">
                </div>
                <div class="form-group">
                    <label>Alt Sunucu Komutu</label>
                    <input type="text" id="cfgSubCmd" class="input-text" placeholder="/server boxpvp">
                </div>
                <div class="form-group">
                    <label>Alt Sunucu Gecikmesi (sn)</label>
                    <input type="number" id="cfgSubDelay" class="input-text" placeholder="3">
                </div>
            </div>
        </div>

        <!-- ANA IZGARA: Sol Bot Yöneticisi, Sağ Canlı Konsol -->
        <div class="main-grid">

            <!-- SOL PANEL: Bot Yöneticisi -->
            <div class="panel">
                <div class="panel-title">🤖 Bot Yöneticisi</div>

                <div class="global-actions">
                    <button class="btn btn-green" style="flex: 1;" onclick="startAll()">Tümünü Başlat</button>
                    <button class="btn btn-red" style="flex: 1;" onclick="stopAll()">Tümünü Durdur</button>
                </div>

                <!-- Hızlı Alt Sunucuya Geçiş Butonları -->
                <div style="display: flex; gap: 5px; margin-bottom: 12px;">
                    <button class="btn btn-purple" style="flex: 1; font-size: 0.75rem;" onclick="quickServer('/server boxpvp')">🚀 BoxPvP'ye Geç</button>
                    <button class="btn btn-purple" style="flex: 1; font-size: 0.75rem;" onclick="quickServer('/server lobi')">🏠 Lobiye Geç</button>
                </div>

                <div style="display: flex; gap: 5px; margin-bottom: 12px;">
                    <input type="text" id="newBotName" class="input-text" placeholder="Yeni Bot Adı" style="flex:1;">
                    <button class="btn btn-blue" onclick="addBot()">Ekle</button>
                </div>

                <div class="bot-list" id="botList">
                    <!-- Botlar Buraya Gelecek -->
                </div>
            </div>

            <!-- SAĞ PANEL: Canlı Konsol -->
            <div class="panel">
                <div class="console-header">
                    <span style="font-weight: 600;">💻 Canlı Konsol ve Sohbet</span>
                    <select id="filterSelect" class="input-select" onchange="changeFilter()">
                        <option value="all">Tüm Botların Akışı</option>
                    </select>
                </div>

                <div class="console-box" id="consoleBox"></div>

                <div class="command-bar">
                    <select id="targetBotSelect" class="input-select">
                        <option value="all">Tüm Botlara</option>
                    </select>
                    <input type="text" id="cmdInput" class="input-text" placeholder="Komut yazın (Örn: /spawn, /register)..." onkeypress="handleKeyPress(event)">
                    <button class="btn btn-blue" onclick="sendCommand()">Gönder</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const socket = io();
        let bots = [];
        let currentFilter = 'all';

        socket.on('init-data', (data) => {
            bots = data.botList;
            loadConfigFields(data.globalConfig);
            renderBotList();
            renderSelectOptions();
        });

        socket.on('config-updated', (config) => {
            loadConfigFields(config);
            alert("Ayarlar başarıyla güncellendi.");
        });

        socket.on('bot-added', (botData) => {
            bots.push(botData);
            renderBotList();
            renderSelectOptions();
        });

        socket.on('bot-deleted', (botId) => {
            bots = bots.filter(b => b.id !== botId);
            if (currentFilter === botId) currentFilter = 'all';
            renderBotList();
            renderSelectOptions();
            changeFilter();
        });

        socket.on('status-update', ({ botId, status }) => {
            const bot = bots.find(b => b.id === botId);
            if (bot) {
                bot.status = status;
                renderBotList();
            }
        });

        socket.on('bot-log', (logData) => {
            const bot = bots.find(b => b.id === logData.botId);
            if (bot) {
                if (!bot.logs) bot.logs = [];
                bot.logs.push(logData);
            }

            if (currentFilter === 'all' || currentFilter === logData.botId) {
                appendLogToConsole(logData);
            }
        });

        function loadConfigFields(cfg) {
            if (!cfg) return;
            document.getElementById('cfgHost').value = cfg.host || '';
            document.getElementById('cfgPort').value = cfg.port || 25565;
            document.getElementById('cfgVersion').value = cfg.version || '';
            document.getElementById('cfgPassword').value = cfg.autoPassword || '';
            document.getElementById('cfgSubCmd').value = cfg.autoSubServerCmd || '';
            document.getElementById('cfgSubDelay').value = cfg.autoSubServerDelay || 3;
        }

        function saveConfig() {
            const newConfig = {
                host: document.getElementById('cfgHost').value.trim(),
                port: document.getElementById('cfgPort').value.trim(),
                version: document.getElementById('cfgVersion').value.trim(),
                autoPassword: document.getElementById('cfgPassword').value.trim(),
                autoSubServerCmd: document.getElementById('cfgSubCmd').value.trim(),
                autoSubServerDelay: document.getElementById('cfgSubDelay').value.trim()
            };
            socket.emit('update-config', newConfig);
        }

        function renderBotList() {
            const listEl = document.getElementById('botList');
            listEl.innerHTML = '';

            bots.forEach(bot => {
                const item = document.createElement('div');
                item.className = 'bot-item';
                item.innerHTML = `
                    <div class="bot-info">
                        <div class="status-dot ${bot.status}"></div>
                        <span style="font-weight: 600;">${bot.username}</span>
                    </div>
                    <div class="action-btns">
                        ${bot.status === 'Offline' 
                            ? `<button class="btn btn-green" style="padding: 4px 8px; font-size:0.75rem;" onclick="startBot('${bot.id}')">Başlat</button>`
                            : `<button class="btn btn-red" style="padding: 4px 8px; font-size:0.75rem;" onclick="stopBot('${bot.id}')">Durdur</button>`
                        }
                        <button class="btn btn-dark-red" style="padding: 4px 8px; font-size:0.75rem;" onclick="deleteBot('${bot.id}', '${bot.username}')">Sil</button>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function renderSelectOptions() {
            const filterSelect = document.getElementById('filterSelect');
            const targetSelect = document.getElementById('targetBotSelect');

            filterSelect.innerHTML = '<option value="all">Tüm Botların Akışı</option>';
            targetSelect.innerHTML = '<option value="all">Tüm Botlara</option>';

            bots.forEach(bot => {
                filterSelect.innerHTML += `<option value="${bot.id}">${bot.username} Konsolu</option>`;
                targetSelect.innerHTML += `<option value="${bot.id}">${bot.username}</option>`;
            });

            filterSelect.value = currentFilter;
        }

        function appendLogToConsole(logData) {
            const consoleBox = document.getElementById('consoleBox');
            const bot = bots.find(b => b.id === logData.botId);
            const botName = bot ? bot.username : logData.botId;

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="log-time">[${logData.timestamp}]</span>
                <span class="log-tag">[${botName}]</span>
                <span>${escapeHtml(logData.text)}</span>
            `;

            consoleBox.appendChild(entry);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function changeFilter() {
            currentFilter = document.getElementById('filterSelect').value;
            const consoleBox = document.getElementById('consoleBox');
            consoleBox.innerHTML = '';

            if (currentFilter === 'all') {
                let allLogs = [];
                bots.forEach(b => { if (b.logs) allLogs = allLogs.concat(b.logs); });
                allLogs.forEach(log => appendLogToConsole(log));
            } else {
                const selectedBot = bots.find(b => b.id === currentFilter);
                if (selectedBot && selectedBot.logs) {
                    selectedBot.logs.forEach(log => appendLogToConsole(log));
                }
            }
        }

        function startBot(id) { socket.emit('start-bot', id); }
        function stopBot(id) { socket.emit('stop-bot', id); }
        function startAll() { socket.emit('start-all'); }
        function stopAll() { socket.emit('stop-all'); }

        function deleteBot(id, username) {
            if (confirm(`"${username}" adlı botu silmek istediğinize emin misiniz?`)) {
                socket.emit('delete-bot', id);
            }
        }

        function addBot() {
            const input = document.getElementById('newBotName');
            if (input.value.trim()) {
                socket.emit('add-bot', input.value.trim());
                input.value = '';
            }
        }

        function quickServer(cmd) {
            socket.emit('send-command', { targetBotId: 'all', command: cmd });
        }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            const target = document.getElementById('targetBotSelect').value;
            if (input.value.trim()) {
                socket.emit('send-command', { targetBotId: target, command: input.value.trim() });
                input.value = '';
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendCommand(); }
        function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    </script>
</body>
</html>
