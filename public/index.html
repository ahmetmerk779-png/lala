<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MC Bot Yönetim Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        /* --- SOFT DARK (TEMİZ/MODERN) TEMA --- */
        :root {
            --bg-body: #111827;       /* Çok koyu, yumuşak lacivert/gri arka plan */
            --bg-card: #1f2937;       /* Kartların arka planı */
            --bg-inner: #374151;      /* Kart içi bölmeler ve inputlar */
            
            --border-color: #374151;  /* Yumuşak sınır çizgileri */
            --border-hover: #4b5563;
            
            --text-main: #f9fafb;     /* Beyaza yakın temiz metin */
            --text-muted: #9ca3af;    /* İkincil soluk metin */
            
            --color-primary: #3b82f6; /* Modern Mavi */
            --color-success: #10b981; /* Yumuşak Yeşil */
            --color-danger: #ef4444;  /* Yumuşak Kırmızı */
            --color-warning: #f59e0b; /* Yumuşak Turuncu */
        }

        /* --- GENEL YAPI VE FONTLAR --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Temiz, sistem fontları (Okunabilirliği maksimuma çıkarır) */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 16px;
            font-size: 14px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- MODERN KARTLAR (Yuvarlatılmış ve Gölgeli) --- */
        .header, .card, .bot-card, .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px; /* Yumuşak köşeler */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .card { padding: 20px; }

        .card-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- FORM ELEMANLARI --- */
        .form-group { display: flex; gap: 8px; }

        input, select {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* --- MODERN BUTONLAR --- */
        button {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:active { transform: translateY(1px); }

        .btn-primary { background: var(--color-primary); }
        .btn-primary:hover { background: #2563eb; }

        .btn-success { background: var(--color-success); }
        .btn-success:hover { background: #059669; }

        .btn-warning { background: var(--color-warning); }
        .btn-warning:hover { background: #d97706; }

        .btn-danger { background: var(--color-danger); }
        .btn-danger:hover { background: #dc2626; }

        .btn-secondary { background: var(--bg-inner); color: var(--text-main); }
        .btn-secondary:hover { background: var(--border-hover); }

        /* --- BOT KARTI --- */
        .bot-card {
            padding: 20px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .bot-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .bot-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .bot-name { font-weight: 700; font-size: 16px; color: #ffffff; }

        .bot-details-bar {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-body);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid var(--border-color);
        }

        .bot-details-bar b { color: var(--text-main); font-weight: 600; }

        /* --- ROZETLER (BADGE) --- */
        .badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px; /* Tam yuvarlak hap rozetler */
            font-weight: 600;
        }
        
        .badge-Online { background: rgba(16, 185, 129, 0.15); color: var(--color-success); }
        .badge-Offline { background: rgba(239, 68, 68, 0.15); color: var(--color-danger); }
        .badge-Connecting { background: rgba(245, 158, 11, 0.15); color: var(--color-warning); }

        .coords-badge {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: var(--color-primary);
            background: rgba(59, 130, 246, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
        }

        /* --- LOG KUTUSU --- */
        .log-box {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            height: 120px;
            overflow-y: auto;
            padding: 12px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .log-line { margin-bottom: 4px; word-break: break-all; }
        .log-info { color: #cbd5e1; }
        .log-success { color: var(--color-success); }
        .log-warn { color: var(--color-warning); }
        .log-error { color: var(--color-danger); }

        /* --- WIDGET IZGARASI (Scoreboard & Tablist) --- */
        .bot-widgets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .widget-box {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
        }

        .widget-title {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* SCOREBOARD ÖZEL DÜZELTMELERİ */
        .scoreboard-line {
            display: flex;
            justify-content: space-between; /* İsim sola, sayı sağa yaslanır */
            align-items: center;
            margin-bottom: 6px;
            font-size: 13px;
            font-family: 'Consolas', monospace; /* Hizasının düzgün durması için */
        }
        .sb-text {
            color: var(--text-main);
            flex: 1; /* Aradaki boşluğu otomatik doldurur */
        }
        .sb-score {
            color: var(--color-danger); /* Skor genelde kırmızı/turuncu gösterilir */
            font-weight: bold;
            margin-left: 10px;
            min-width: 20px;
            text-align: right;
        }

        /* TABLIST */
        .tablist-container { max-height: 200px; overflow-y: auto; }
        .tab-line {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }
        .tab-line:last-child { border-bottom: none; }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-inner); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

        /* --- MODAL PENCERELER --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px);
            display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 16px;
        }

        .modal {
            width: 100%; max-width: 400px;
            padding: 24px; display: flex; flex-direction: column; gap: 16px;
        }
        
        .modal-title { font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MC Panel</h1>
        <button class="btn-secondary" onclick="openGlobalSettings()">Genel Ayarlar</button>
    </div>

    <div class="card">
        <div class="card-header">Toplu İşlemler & Konsol</div>
        <div class="form-group" style="margin-bottom: 12px;">
            <select id="targetBotSelect" style="max-width: 140px;">
                <option value="all">Tüm Botlar</option>
            </select>
            <input type="text" id="globalCmdInput" placeholder="Komut yazın (/afk, /login...)" style="flex: 1;">
            <button class="btn-primary" onclick="sendGlobalCommand()">Gönder</button>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-success" style="flex: 1;" onclick="socket.emit('start-all')">Tümünü Başlat</button>
            <button class="btn-danger" style="flex: 1;" onclick="socket.emit('stop-all')">Tümünü Durdur</button>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span>Bot Listesi</span>
            <div class="form-group" style="margin: 0; gap: 8px;">
                <input type="text" id="newBotUsername" placeholder="Yeni Bot İsmi" style="width: 150px; padding: 6px 10px;">
                <button class="btn-primary" style="padding: 6px 12px;" onclick="addBot()">Ekle</button>
            </div>
        </div>
        <div id="botListContainer"></div>
    </div>
</div>

<div class="modal-overlay" id="botSettingsModal">
    <div class="modal">
        <div class="modal-title">Bot Ayarları (<span id="modalBotName"></span>)</div>
        <input type="hidden" id="modalBotId">
        <div class="field"><label>Sunucu IP</label><input type="text" id="modalHost"></div>
        <div class="field"><label>Port</label><input type="number" id="modalPort"></div>
        <div class="field"><label>Versiyon</label><input type="text" id="modalVersion"></div>
        <div class="field"><label>Şifre (/login)</label><input type="text" id="modalPassword"></div>
        <div class="field"><label>Alt Sunucu Komutu</label><input type="text" id="modalSubCmd"></div>
        <div style="display: flex; gap: 10px; margin-top: 8px;">
            <button class="btn-primary" style="flex: 1;" onclick="saveBotSettings()">Kaydet</button>
            <button class="btn-secondary" style="flex: 1;" onclick="closeModal('botSettingsModal')">İptal</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="globalSettingsModal">
    <div class="modal">
        <div class="modal-title">Varsayılan Ayarlar</div>
        <div class="field"><label>IP</label><input type="text" id="gModalHost"></div>
        <div class="field"><label>Port</label><input type="number" id="gModalPort"></div>
        <div class="field"><label>Versiyon</label><input type="text" id="gModalVersion"></div>
        <div class="field"><label>Şifre</label><input type="text" id="gModalPassword"></div>
        <div class="field"><label>Alt Sunucu Komutu</label><input type="text" id="gModalSubCmd"></div>
        <div style="display: flex; gap: 10px; margin-top: 8px;">
            <button class="btn-primary" style="flex: 1;" onclick="saveGlobalSettings()">Kaydet</button>
            <button class="btn-secondary" style="flex: 1;" onclick="closeModal('globalSettingsModal')">İptal</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let botsMap = new Map();
    let globalConfig = {};

    // 1. KRİTİK DÜZELTME: MİNECRAFT ÖZEL KARAKTERLERİNİ (☒) TEMİZLEME FONKSİYONU
    function cleanMCString(str) {
        if (!str) return '';
        // \uE000-\uF8FF aralığı, Minecraft Sunucularının Resource Pack ikonları için kullandığı boş(bozuk) karakterleri temsil eder.
        return str.replace(/[\uE000-\uF8FF]/g, '').trim();
    }

    socket.on('init-data', (data) => {
        botsMap.clear();
        globalConfig = data.globalConfig || {};
        data.botList.forEach(bot => botsMap.set(bot.id, bot));
        renderBotList();
    });

    socket.on('bot-added', (bot) => {
        botsMap.set(bot.id, bot);
        renderBotList();
    });

    socket.on('bot-deleted', (botId) => {
        botsMap.delete(botId);
        renderBotList();
    });

    socket.on('bot-updated', ({ botId, config }) => {
        if (botsMap.has(botId)) {
            Object.assign(botsMap.get(botId), config);
            renderBotList();
        }
    });

    socket.on('config-updated', (cfg) => { globalConfig = cfg; });

    socket.on('status-update', ({ botId, status, onlineSince }) => {
        if (botsMap.has(botId)) {
            const bot = botsMap.get(botId);
            bot.status = status;
            bot.onlineSince = onlineSince;
            
            const badge = document.getElementById(`badge-${botId}`);
            if (badge) {
                badge.innerText = status;
                badge.className = `badge badge-${status}`;
            }
        }
    });

    socket.on('bot-log', (log) => {
        if (botsMap.has(log.botId)) {
            const bot = botsMap.get(log.botId);
            bot.logs.push(log);
            if (bot.logs.length > 30) bot.logs.shift();

            const logBox = document.getElementById(`logs-${log.botId}`);
            if (logBox) {
                const div = document.createElement('div');
                div.className = `log-line log-${log.type}`;
                div.innerText = `[${log.timestamp}] ${log.text}`;
                logBox.appendChild(div);
                logBox.scrollTop = logBox.scrollHeight;
            }
        }
    });

    socket.on('bot-map-update', ({ botId, pos }) => {
        if (botsMap.has(botId)) {
            botsMap.get(botId).pos = pos;
            const coordsEl = document.getElementById(`coords-${botId}`);
            if (coordsEl) {
                coordsEl.innerText = `X:${Math.round(pos.x)} Y:${Math.round(pos.y)} Z:${Math.round(pos.z)}`;
            }
        }
    });

    socket.on('bot-tablist', ({ botId, players }) => {
        if (botsMap.has(botId)) {
            botsMap.get(botId).tabList = players;
            renderTabList(botId, players);
        }
    });

    socket.on('bot-scoreboard', ({ botId, scoreboard }) => {
        const titleEl = document.getElementById(`sb-title-${botId}`);
        const linesEl = document.getElementById(`sb-lines-${botId}`);
        if (!linesEl) return;

        if (!scoreboard || !scoreboard.lines || scoreboard.lines.length === 0) {
            if (titleEl) titleEl.innerText = 'Scoreboard';
            linesEl.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 10px;">Veri yok</div>`;
            return;
        }

        // Başlığı temizle
        if (titleEl && scoreboard.title) {
            titleEl.innerText = cleanMCString(scoreboard.title);
        }
        
        linesEl.innerHTML = '';
        
        // 2. KRİTİK DÜZELTME: SCOREBOARD SATIRLARINI DÜZGÜN HİZALAMA VE TEMİZLEME
        scoreboard.lines.forEach(item => {
            const row = document.createElement('div');
            row.className = 'scoreboard-line';
            
            const cleanText = cleanMCString(item.text); // Bozuk karakterleri kaldırır
            
            // Flex yapısı: Metin sola, Skor sağa
            row.innerHTML = `
                <span class="sb-text">${cleanText}</span>
                <span class="sb-score">${item.score}</span>
            `;
            linesEl.appendChild(row);
        });
    });

    function renderBotList() {
        const container = document.getElementById('botListContainer');
        const select = document.getElementById('targetBotSelect');
        
        container.innerHTML = '';
        select.innerHTML = '<option value="all">Tüm Botlar</option>';

        botsMap.forEach((bot) => {
            const opt = document.createElement('option');
            opt.value = bot.id;
            opt.innerText = bot.username;
            select.appendChild(opt);

            const pos = bot.pos || { x: 0, y: 0, z: 0 };
            const botHost = bot.host || globalConfig.host || '-';
            const botPort = bot.port || globalConfig.port || 25565;

            const card = document.createElement('div');
            card.className = 'bot-card';
            
            card.innerHTML = `
                <div class="bot-top">
                    <div class="bot-title">
                        <span class="bot-name">${bot.username}</span>
                        <span id="badge-${bot.id}" class="badge badge-${bot.status}">${bot.status}</span>
                        <span class="coords-badge" id="coords-${bot.id}">X:${Math.round(pos.x)} Y:${Math.round(pos.y)} Z:${Math.round(pos.z)}</span>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button class="btn-success" onclick="socket.emit('start-bot', '${bot.id}')">Başlat</button>
                        <button class="btn-warning" onclick="socket.emit('stop-bot', '${bot.id}')">Durdur</button>
                        <button class="btn-secondary" onclick="openBotSettings('${bot.id}')">⚙️</button>
                        <button class="btn-danger" onclick="socket.emit('delete-bot', '${bot.id}')">Sil</button>
                    </div>
                </div>

                <div class="bot-details-bar">
                    <span>IP: <b>${botHost}:${botPort}</b></span>
                </div>

                <div class="log-box" id="logs-${bot.id}">
                    ${(bot.logs || []).map(l => `<div class="log-line log-${l.type}">[${l.timestamp}]${l.text}</div>`).join('')}
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <input type="text" id="cmd-${bot.id}" placeholder="Bağımsız komut gönder (/say merhaba)" style="flex: 1;">
                    <button class="btn-primary" onclick="sendSingleCommand('${bot.id}')">Gönder</button>
                </div>

                <div class="bot-widgets-grid">
                    <div class="widget-box">
                        <div class="widget-title">
                            <span id="sb-title-${bot.id}">Scoreboard</span>
                        </div>
                        <div id="sb-lines-${bot.id}">
                            <div style="color: var(--text-muted); text-align: center; font-size: 13px;">Bekleniyor...</div>
                        </div>
                    </div>

                    <div class="widget-box">
                        <div class="widget-title">
                            <span>Tab Listesi</span>
                            <span id="tab-count-${bot.id}" style="color:var(--color-primary);">0</span>
                        </div>
                        <div class="tablist-container" id="tab-body-${bot.id}">
                            <div style="text-align:center; color:var(--text-muted); font-size: 13px;">Veri yok</div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
            renderTabList(bot.id, bot.tabList || []);
            
            const lb = document.getElementById(`logs-${bot.id}`);
            if (lb) lb.scrollTop = lb.scrollHeight;
        });
    }

    function renderTabList(botId, players) {
        const tbody = document.getElementById(`tab-body-${botId}`);
        const countEl = document.getElementById(`tab-count-${botId}`);
        if (!tbody) return;

        if (countEl) countEl.innerText = `${players ? players.length : 0}`;
        tbody.innerHTML = '';

        if (!players || players.length === 0) {
            tbody.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:13px; padding-top:10px;">Liste boş</div>`;
            return;
        }

        players.forEach(p => {
            const row = document.createElement('div');
            row.className = 'tab-line';
            
            // İsimleri de temizliyoruz (Tab'da clan taglarında ikon varsa temizlenir)
            let name = p.displayName || p.name || 'Bilinmiyor';
            name = cleanMCString(name);
            
            const ping = p.ping !== undefined ? `${p.ping}ms` : '-';
            let pingColor = 'var(--color-success)';
            if (p.ping > 150) pingColor = 'var(--color-warning)';
            if (p.ping > 300) pingColor = 'var(--color-danger)';

            row.innerHTML = `
                <span style="color: var(--text-main); font-family: 'Consolas', monospace;">${name}</span>
                <span style="color: ${pingColor};">${ping}</span>
            `;
            tbody.appendChild(row);
        });
    }

    function openBotSettings(botId) {
        const bot = botsMap.get(botId);
        if (!bot) return;
        document.getElementById('modalBotId').value = bot.id;
        document.getElementById('modalBotName').innerText = bot.username;
        document.getElementById('modalHost').value = bot.host || globalConfig.host || '';
        document.getElementById('modalPort').value = bot.port || globalConfig.port || 25565;
        document.getElementById('modalVersion').value = bot.version || globalConfig.version || '';
        document.getElementById('modalPassword').value = bot.autoPassword !== undefined ? bot.autoPassword : (globalConfig.autoPassword || '');
        document.getElementById('modalSubCmd').value = bot.autoSubServerCmd !== undefined ? bot.autoSubServerCmd : (globalConfig.autoSubServerCmd || '');
        document.getElementById('botSettingsModal').style.display = 'flex';
    }

    function saveBotSettings() {
        const botId = document.getElementById('modalBotId').value;
        const config = {
            host: document.getElementById('modalHost').value.trim(),
            port: Number(document.getElementById('modalPort').value),
            version: document.getElementById('modalVersion').value.trim(),
            autoPassword: document.getElementById('modalPassword').value.trim(),
            autoSubServerCmd: document.getElementById('modalSubCmd').value.trim()
        };
        socket.emit('update-bot-config', { botId, config });
        closeModal('botSettingsModal');
    }

    function openGlobalSettings() {
        document.getElementById('gModalHost').value = globalConfig.host || '';
        document.getElementById('gModalPort').value = globalConfig.port || 25565;
        document.getElementById('gModalVersion').value = globalConfig.version || '';
        document.getElementById('gModalPassword').value = globalConfig.autoPassword || '';
        document.getElementById('gModalSubCmd').value = globalConfig.autoSubServerCmd || '';
        document.getElementById('globalSettingsModal').style.display = 'flex';
    }

    function saveGlobalSettings() {
        const newConfig = {
            host: document.getElementById('gModalHost').value.trim(),
            port: Number(document.getElementById('gModalPort').value),
            version: document.getElementById('gModalVersion').value.trim(),
            autoPassword: document.getElementById('gModalPassword').value.trim() || '',
            autoSubServerCmd: document.getElementById('gModalSubCmd').value.trim()
        };
        socket.emit('update-config', newConfig);
        closeModal('globalSettingsModal');
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function addBot() {
        const input = document.getElementById('newBotUsername');
        if (input.value.trim()) {
            socket.emit('add-bot', { username: input.value.trim() });
            input.value = '';
        }
    }

    function sendGlobalCommand() {
        const target = document.getElementById('targetBotSelect').value;
        const cmd = document.getElementById('globalCmdInput').value;
        if (cmd.trim()) {
            socket.emit('send-command', { targetBotId: target, command: cmd.trim() });
            document.getElementById('globalCmdInput').value = '';
        }
    }

    function sendSingleCommand(botId) {
        const input = document.getElementById(`cmd-${botId}`);
        if (input && input.value.trim()) {
            socket.emit('send-command', { targetBotId: botId, command: input.value.trim() });
            input.value = '';
        }
    }
</script>
</body>
</html>
