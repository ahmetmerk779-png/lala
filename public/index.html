<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Bot Yönetim Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        body {
            background-color: #121212;
            color: #d4d4d4;
            padding: 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            color: #4ec9b0;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        input, select, button {
            background-color: #252526;
            border: 1px solid #3c3c3c;
            color: #ccc;
            padding: 8px 12px;
            border-radius: 3px;
            font-size: 13px;
        }

        input:focus {
            outline: 1px solid #007acc;
        }

        button {
            cursor: pointer;
            font-weight: bold;
        }

        button.btn-green { background-color: #2e7d32; color: #fff; border: none; }
        button.btn-red { background-color: #c62828; color: #fff; border: none; }
        button.btn-blue { background-color: #1565c0; color: #fff; border: none; }
        button.btn-orange { background-color: #e65100; color: #fff; border: none; }

        .bot-card {
            background-color: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .bot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .bot-status {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }
        .status-Online { background-color: #1b5e20; color: #81c784; }
        .status-Offline { background-color: #b71c1c; color: #ef9a9a; }
        .status-Connecting { background-color: #f57f17; color: #fff176; }

        .log-box {
            background-color: #0d0d0d;
            border: 1px solid #222;
            height: 110px;
            overflow-y: auto;
            padding: 6px;
            font-size: 11px;
            margin-bottom: 8px;
            border-radius: 3px;
        }

        .log-line { margin-bottom: 2px; word-break: break-all; }
        .log-info { color: #9cdcfe; }
        .log-success { color: #6a9955; }
        .log-warn { color: #d7ba7d; }
        .log-error { color: #f44747; }
        .log-chat { color: #ce9178; }

        /* ENVANTER BÖLÜMÜ (HER BOTA ÖZEL IZGARA) */
        .inventory-section {
            margin-top: 10px;
            background-color: #111;
            border: 1px solid #252526;
            padding: 8px;
            border-radius: 3px;
        }

        .inventory-header {
            font-size: 12px;
            color: #dcdcaa;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
        }

        .inv-slot {
            background-color: #222;
            border: 1px solid #333;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            position: relative;
            border-radius: 2px;
        }

        .inv-slot.has-item {
            background-color: #2a2d32;
            border-color: #4ec9b0;
        }

        .inv-slot-id {
            color: #888;
            font-size: 9px;
            line-height: 1;
        }

        .inv-slot-count {
            position: absolute;
            bottom: 2px;
            right: 3px;
            color: #ffcc00;
            font-weight: bold;
            font-size: 10px;
        }

        .cmd-group {
            display: flex;
            gap: 5px;
        }
        .cmd-group input { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-title">💬 OYUN İÇİ SOHBET & KOMUT KONSOLU</div>
        <div class="cmd-group">
            <select id="targetBotSelect">
                <option value="all">Tüm Botlar (All)</option>
            </select>
            <input type="text" id="globalCmdInput" placeholder="Mesaj veya komut yazın (/afk, /login ...)">
            <button class="btn-green" onclick="sendGlobalCommand()">Gönder</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">[+] BOT YÖNETİMİ</div>
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <input type="text" id="newBotUsername" placeholder="Yeni Bot Kullanıcı Adı" style="flex: 1;">
            <button class="btn-green" onclick="addBot()">Bot Ekle</button>
        </div>
        <div>
            <button class="btn-green" onclick="socket.emit('start-all')">⚡ Tümünü Başlat</button>
            <button class="btn-red" onclick="socket.emit('stop-all')">🛑 Tümünü Durdur</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">[=] BOT LİSTESİ</div>
        <div id="botListContainer"></div>
    </div>
</div>

<script>
    const socket = io();
    let botsMap = new Map();

    socket.on('init-data', (data) => {
        botsMap.clear();
        data.botList.forEach(bot => botsMap.set(bot.id, bot));
        renderBotList();
    });

    socket.on('bot-added', (bot) => {
        botsMap.set(bot.id, bot);
        renderBotList();
    });

    socket.on('bot-deleted', (botId) => {
        botsMap.delete(botId);
        renderBotList();
    });

    socket.on('status-update', ({ botId, status }) => {
        if (botsMap.has(botId)) {
            botsMap.get(botId).status = status;
            const statusEl = document.getElementById(`status-${botId}`);
            if (statusEl) {
                statusEl.innerText = status;
                statusEl.className = `bot-status status-${status}`;
            }
        }
    });

    socket.on('bot-log', (log) => {
        if (botsMap.has(log.botId)) {
            const bot = botsMap.get(log.botId);
            bot.logs.push(log);
            if (bot.logs.length > 15) bot.logs.shift();

            const logBox = document.getElementById(`logs-${log.botId}`);
            if (logBox) {
                const div = document.createElement('div');
                div.className = `log-line log-${log.type}`;
                div.innerText = `[${log.timestamp}] ${log.text}`;
                logBox.appendChild(div);
                logBox.scrollTop = logBox.scrollHeight;
            }
        }
    });

    // ANLIK ENVANTER GÜNCELLEMESİ (BOT BAZLI)
    socket.on('bot-inventory', ({ botId, inventory }) => {
        if (botsMap.has(botId)) {
            botsMap.get(botId).inventory = inventory;
            renderInventoryGrid(botId, inventory);
        }
    });

    function renderBotList() {
        const container = document.getElementById('botListContainer');
        const select = document.getElementById('targetBotSelect');
        
        container.innerHTML = '';
        select.innerHTML = '<option value="all">Tüm Botlar (All)</option>';

        botsMap.forEach((bot) => {
            // Select Güncelleme
            const opt = document.createElement('option');
            opt.value = bot.id;
            opt.innerText = bot.username;
            select.appendChild(opt);

            // Bot Kartı Tasarımı
            const card = document.createElement('div');
            card.className = 'bot-card';
            card.innerHTML = `
                <div class="bot-header">
                    <div>
                        <strong style="color: #4ec9b0;">${bot.username}</strong>
                        <span id="status-${bot.id}" class="bot-status status-${bot.status}">${bot.status}</span>
                    </div>
                    <div style="display:flex; gap: 4px;">
                        <button class="btn-green" onclick="socket.emit('start-bot', '${bot.id}')">Başlat</button>
                        <button class="btn-orange" onclick="socket.emit('stop-bot', '${bot.id}')">Durdur</button>
                        <button class="btn-red" onclick="socket.emit('delete-bot', '${bot.id}')">Sil</button>
                    </div>
                </div>

                <div class="log-box" id="logs-${bot.id}">
                    ${(bot.logs || []).map(l => `<div class="log-line log-${l.type}">[${l.timestamp}]${l.text}</div>`).join('')}
                </div>

                <div class="cmd-group" style="margin-bottom: 8px;">
                    <input type="text" id="cmd-${bot.id}" placeholder="${bot.username} için mesaj/komut...">
                    <button class="btn-blue" onclick="sendSingleCommand('${bot.id}')">Gönder</button>
                </div>

                <!-- BOTA ÖZEL ENVANTER PANENLİ -->
                <div class="inventory-section">
                    <div class="inventory-header">
                        <span>🎒 Envanter (Slot 0-35)</span>
                    </div>
                    <div class="inventory-grid" id="inv-grid-${bot.id}">
                        <!-- Slottlar buraya eklenecek -->
                    </div>
                </div>
            `;
            container.appendChild(card);

            // İlk Envanter Çizimi
            renderInventoryGrid(bot.id, bot.inventory || {});

            // Log kutusunu alta kaydır
            const lb = document.getElementById(`logs-${bot.id}`);
            if (lb) lb.scrollTop = lb.scrollHeight;
        });
    }

    function renderInventoryGrid(botId, inventory) {
        const grid = document.getElementById(`inv-grid-${botId}`);
        if (!grid) return;

        grid.innerHTML = '';
        
        // 36 Slotluk standart envanter ızgarası (0-35)
        for (let i = 0; i < 36; i++) {
            const item = inventory[i];
            const slotDiv = document.createElement('div');

            if (item) {
                slotDiv.className = 'inv-slot has-item';
                slotDiv.title = `ID: ${item.id} | Adet: ${item.count}`;
                slotDiv.innerHTML = `
                    <span class="inv-slot-id">ID:${item.id}</span>
                    <span class="inv-slot-count">x${item.count}</span>
                `;
            } else {
                slotDiv.className = 'inv-slot';
                slotDiv.innerHTML = `<span class="inv-slot-id" style="opacity: 0.3;">${i}</span>`;
            }
            grid.appendChild(slotDiv);
        }
    }

    function addBot() {
        const input = document.getElementById('newBotUsername');
        if (input.value.trim()) {
            socket.emit('add-bot', { username: input.value.trim() });
            input.value = '';
        }
    }

    function sendGlobalCommand() {
        const target = document.getElementById('targetBotSelect').value;
        const cmd = document.getElementById('globalCmdInput').value;
        if (cmd.trim()) {
            socket.emit('send-command', { targetBotId: target, command: cmd.trim() });
            document.getElementById('globalCmdInput').value = '';
        }
    }

    function sendSingleCommand(botId) {
        const input = document.getElementById(`cmd-${botId}`);
        if (input && input.value.trim()) {
            socket.emit('send-command', { targetBotId: botId, command: input.value.trim() });
            input.value = '';
        }
    }
</script>
</body>
</html>
