<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Bot Yönetim Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; color: #fff; }
        .log-box { background-color: #0d0d0d; color: #00ff66; font-family: monospace; height: 350px; overflow-y: auto; font-size: 0.85rem; border: 1px solid #222; }
        .log-entry { margin-bottom: 3px; word-break: break-word; }
        .log-type-error { color: #ff4d4d; }
        .log-type-warn { color: #ffcc00; }
        .log-type-success { color: #00ff66; }
        .log-type-chat { color: #3399ff; }
        .log-type-command { color: #e600ff; }
        .badge-online { background-color: #28a745; }
        .badge-connecting { background-color: #ffc107; color: #000; }
        .badge-offline { background-color: #dc3545; }
        .bot-card { border-left: 4px solid #555; }
        .bot-card.Online { border-left-color: #28a745; }
        .bot-card.Connecting { border-left-color: #ffc107; }
        .bot-card.Offline { border-left-color: #dc3545; }
        .inv-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: #111; padding: 10px; border-radius: 6px; }
        .inv-slot { background: #222; border: 1px solid #444; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; position: relative; text-align: center; }
        .inv-slot-count { position: absolute; bottom: 2px; right: 4px; font-weight: bold; font-size: 0.7rem; color: #ff0; }
    </style>
</head>
<body>

<div class="container-fluid py-4 px-3 px-md-4">
    <!-- Başlık & Butonlar -->
    <div class="row align-items-center mb-4">
        <div class="col-md-6 mb-3 mb-md-0">
            <h2 class="fw-bold m-0"><i class="fa-solid fa-robot text-primary me-2"></i>MC Bot Control Panel</h2>
        </div>
        <div class="col-md-6 text-md-end">
            <button class="btn btn-success me-2 fw-semibold" onclick="startAllBots()"><i class="fa-solid fa-play me-1"></i> Tümünü Başlat</button>
            <button class="btn btn-danger me-2 fw-semibold" onclick="stopAllBots()"><i class="fa-solid fa-stop me-1"></i> Tümünü Durdur</button>
            <button class="btn btn-primary fw-semibold" data-bs-toggle="modal" data-bs-target="#addBotModal"><i class="fa-solid fa-plus me-1"></i> Bot Ekle</button>
        </div>
    </div>

    <div class="row">
        <!-- Sol Kolon: Bot Kartları -->
        <div class="col-lg-7 mb-4">
            <div class="card mb-3">
                <div class="card-header bg-dark d-flex justify-content-between align-items-center">
                    <span class="fw-bold"><i class="fa-solid fa-users me-2"></i>Botlar (<span id="botCount">0</span>)</span>
                </div>
                <div class="card-body p-3">
                    <div id="botListContainer" class="row g-3"></div>
                </div>
            </div>
        </div>

        <!-- Sağ Kolon: Konsol & Ayarlar -->
        <div class="col-lg-5">
            <div class="card mb-3">
                <div class="card-header bg-dark d-flex justify-content-between align-items-center">
                    <span class="fw-bold"><i class="fa-solid fa-terminal me-2"></i>Canlı Konsol / Log</span>
                    <select id="logFilterSelect" class="form-select form-select-sm w-auto bg-secondary text-white border-0">
                        <option value="all">Tüm Botlar</option>
                    </select>
                </div>
                <div class="card-body p-2">
                    <div id="logBox" class="log-box p-2 rounded"></div>
                    <div class="input-group mt-2">
                        <select id="cmdTargetSelect" class="form-select bg-dark text-white border-secondary" style="max-width: 120px;">
                            <option value="all">Tümü</option>
                        </select>
                        <input type="text" id="cmdInput" class="form-control bg-dark text-white border-secondary" placeholder="Komut yazın (/gir asmp vb.)">
                        <button class="btn btn-primary" onclick="sendCommand()"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <!-- Genel Ayarlar Formu -->
            <div class="card">
                <div class="card-header bg-dark fw-bold"><i class="fa-solid fa-gear me-2"></i>Genel Sunucu Ayarları</div>
                <div class="card-body p-3">
                    <form id="globalConfigForm" onsubmit="saveGlobalConfig(event)">
                        <div class="row g-2">
                            <div class="col-8">
                                <label class="form-label small mb-1">Sunucu IP</label>
                                <input type="text" id="cfgHost" class="form-control form-control-sm bg-dark text-white border-secondary" required>
                            </div>
                            <div class="col-4">
                                <label class="form-label small mb-1">Port</label>
                                <input type="number" id="cfgPort" class="form-control form-control-sm bg-dark text-white border-secondary" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small mb-1">Sürüm</label>
                                <input type="text" id="cfgVersion" class="form-control form-control-sm bg-dark text-white border-secondary">
                            </div>
                            <div class="col-6">
                                <label class="form-label small mb-1">Şifre (/login)</label>
                                <input type="text" id="cfgPassword" class="form-control form-control-sm bg-dark text-white border-secondary">
                            </div>
                            <div class="col-12">
                                <label class="form-label small mb-1">Alt Sunucu Komutu</label>
                                <input type="text" id="cfgSubCmd" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="/gir asmp">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-sm btn-outline-primary mt-3 w-100">Ayarları Kaydet</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Envanter Görüntüleme -->
<div class="modal fade" id="inventoryModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="invModalTitle"><i class="fa-solid fa-box-open me-2"></i>Bot Envanteri</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="inv-grid" id="invGridContainer"></div>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Bot Ekle -->
<div class="modal fade" id="addBotModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header border-secondary">
                <h5 class="modal-title"><i class="fa-solid fa-user-plus me-2"></i>Yeni Bot Ekle</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Kullanıcı Adı</label>
                    <input type="text" id="newBotUsername" class="form-control bg-secondary text-white border-0" placeholder="Efe_Pro99" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Özel Proxy (İsteğe Bağlı)</label>
                    <input type="text" id="newBotProxy" class="form-control bg-secondary text-white border-0" placeholder="socks5://user:pass@ip:port">
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                <button type="button" class="btn btn-primary" onclick="addBot()">Ekle</button>
            </div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const socket = io();
    let botCache = new Map();
    let selectedLogBot = 'all';
    let currentActiveInvBotId = null;

    socket.on('init-data', ({ botList, globalConfig }) => {
        document.getElementById('cfgHost').value = globalConfig.host || '';
        document.getElementById('cfgPort').value = globalConfig.port || 25565;
        document.getElementById('cfgVersion').value = globalConfig.version || '1.20.1';
        document.getElementById('cfgPassword').value = globalConfig.autoPassword || '';
        document.getElementById('cfgSubCmd').value = globalConfig.autoSubServerCmd || '';

        botCache.clear();
        botList.forEach(bot => botCache.set(bot.id, bot));
        renderBotCards();
        updateDropdowns();
    });

    socket.on('status-update', ({ botId, status, onlineSince }) => {
        if (botCache.has(botId)) {
            const bot = botCache.get(botId);
            bot.status = status;
            bot.onlineSince = onlineSince;
            renderBotCards();
        }
    });

    socket.on('bot-pos-update', ({ botId, pos }) => {
        if (botCache.has(botId)) {
            botCache.get(botId).pos = pos;
            renderBotCards();
        }
    });

    socket.on('bot-inventory-update', ({ botId, inventory }) => {
        if (botCache.has(botId)) {
            botCache.get(botId).inventory = inventory;
            if (currentActiveInvBotId === botId) {
                renderInventoryModal(botId);
            }
        }
    });

    socket.on('bot-added', (newBot) => {
        botCache.set(newBot.id, newBot);
        renderBotCards();
        updateDropdowns();
    });

    socket.on('bot-deleted', (botId) => {
        botCache.delete(botId);
        renderBotCards();
        updateDropdowns();
    });

    socket.on('bot-log', (logEntry) => {
        const filter = document.getElementById('logFilterSelect').value;
        if (filter === 'all' || filter === logEntry.botId) {
            appendLogToBox(logEntry);
        }
    });

    function renderBotCards() {
        const container = document.getElementById('botListContainer');
        container.innerHTML = '';
        document.getElementById('botCount').innerText = botCache.size;

        botCache.forEach(bot => {
            const badgeClass = bot.status === 'Online' ? 'badge-online' : (bot.status === 'Connecting' ? 'badge-connecting' : 'badge-offline');
            const posStr = bot.pos ? `X: ${bot.pos.x} | Y: ${bot.pos.y} | Z: ${bot.pos.z}` : 'Konum yok';

            const cardHtml = `
                <div class="col-md-6">
                    <div class="card bot-card ${bot.status} h-100">
                        <div class="card-body p-3 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h6 class="fw-bold m-0 text-truncate">${bot.username}</h6>
                                    <span class="badge ${badgeClass}">${bot.status}</span>
                                </div>
                                <div class="small text-muted mb-2"><i class="fa-solid fa-location-dot me-1"></i>${posStr}</div>
                            </div>
                            <div class="d-flex gap-1 mt-2">
                                ${bot.status === 'Offline' ? 
                                    `<button class="btn btn-sm btn-success flex-grow-1" onclick="startBot('${bot.id}')"><i class="fa-solid fa-play"></i></button>` : 
                                    `<button class="btn btn-sm btn-warning flex-grow-1" onclick="stopBot('${bot.id}')"><i class="fa-solid fa-stop"></i></button>`
                                }
                                <button class="btn btn-sm btn-outline-info" onclick="openInventoryModal('${bot.id}')"><i class="fa-solid fa-box-open"></i></button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteBot('${bot.id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHtml;
        });
    }

    function openInventoryModal(botId) {
        currentActiveInvBotId = botId;
        const bot = botCache.get(botId);
        if (!bot) return;

        document.getElementById('invModalTitle').innerText = `📦 ${bot.username} - Envanter`;
        renderInventoryModal(botId);
        
        const modal = new bootstrap.Modal(document.getElementById('inventoryModal'));
        modal.show();
    }

    function renderInventoryModal(botId) {
        const grid = document.getElementById('invGridContainer');
        grid.innerHTML = '';
        const bot = botCache.get(botId);
        const inv = bot ? (bot.inventory || {}) : {};

        for (let i = 0; i < 36; i++) {
            const item = inv[i];
            if (item) {
                grid.innerHTML += `
                    <div class="inv-slot" title="${item.displayName}">
                        <span class="text-truncate px-1">${item.displayName}</span>
                        ${item.count > 1 ? `<span class="inv-slot-count">${item.count}</span>` : ''}
                    </div>
                `;
            } else {
                grid.innerHTML += `<div class="inv-slot text-muted small">${i}</div>`;
            }
        }
    }

    function updateDropdowns() {
        const filterSel = document.getElementById('logFilterSelect');
        const cmdSel = document.getElementById('cmdTargetSelect');

        const currentFilter = filterSel.value;
        const currentCmd = cmdSel.value;

        filterSel.innerHTML = '<option value="all">Tüm Botlar</option>';
        cmdSel.innerHTML = '<option value="all">Tümü</option>';

        botCache.forEach(bot => {
            filterSel.innerHTML += `<option value="${bot.id}">${bot.username}</option>`;
            cmdSel.innerHTML += `<option value="${bot.id}">${bot.username}</option>`;
        });

        filterSel.value = currentFilter;
        cmdSel.value = currentCmd;
    }

    function appendLogToBox(log) {
        const box = document.getElementById('logBox');
        const bot = botCache.get(log.botId);
        const name = bot ? bot.username : log.botId;

        const div = document.createElement('div');
        div.className = `log-entry log-type-${log.type || 'info'}`;
        div.innerText = `[${log.timestamp}] [${name}]: ${log.text}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    document.getElementById('logFilterSelect').addEventListener('change', (e) => {
        selectedLogBot = e.target.value;
        const box = document.getElementById('logBox');
        box.innerHTML = '';
        
        botCache.forEach(bot => {
            if (bot.logs) {
                bot.logs.forEach(log => {
                    if (selectedLogBot === 'all' || selectedLogBot === log.botId) {
                        appendLogToBox(log);
                    }
                });
            }
        });
    });

    document.getElementById('cmdInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendCommand(); });

    function startBot(id) { socket.emit('start-bot', id); }
    function stopBot(id) { socket.emit('stop-bot', id); }
    function startAllBots() { socket.emit('start-all'); }
    function stopAllBots() { socket.emit('stop-all'); }
    function deleteBot(id) { if (confirm('Botu silmek istediğinize emin misiniz?')) socket.emit('delete-bot', id); }

    function addBot() {
        const username = document.getElementById('newBotUsername').value.trim();
        const proxy = document.getElementById('newBotProxy').value.trim();
        if (!username) return alert('Kullanıcı adı gerekli.');

        socket.emit('add-bot', { username, proxy });
        document.getElementById('newBotUsername').value = '';
        document.getElementById('newBotProxy').value = '';

        bootstrap.Modal.getInstance(document.getElementById('addBotModal')).hide();
    }

    function sendCommand() {
        const input = document.getElementById('cmdInput');
        const command = input.value.trim();
        const targetBotId = document.getElementById('cmdTargetSelect').value;

        if (!command) return;
        socket.emit('send-command', { targetBotId, command });
        input.value = '';
    }

    function saveGlobalConfig(e) {
        e.preventDefault();
        const config = {
            host: document.getElementById('cfgHost').value.trim(),
            port: Number(document.getElementById('cfgPort').value),
            version: document.getElementById('cfgVersion').value.trim(),
            autoPassword: document.getElementById('cfgPassword').value.trim(),
            autoSubServerCmd: document.getElementById('cfgSubCmd').value.trim()
        };
        socket.emit('update-config', config);
        alert('Ayarlar kaydedildi.');
    }
</script>
</body>
</html>
