<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Çoklu Bot Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-yellow: #eab308;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 15px; }

        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 320px 1fr; gap: 15px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .panel { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
        .panel-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

        /* Bot Listesi */
        .global-actions { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn { border: none; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; color: #fff; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-green { background-color: var(--accent-green); }
        .btn-red { background-color: var(--accent-red); }
        .btn-blue { background-color: var(--accent-blue); }

        .bot-list { display: flex; flex-direction: column; gap: 8px; max-height: 500px; overflow-y: auto; }
        .bot-item { background: #0f172a; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; }
        .bot-item.active { border-color: var(--accent-blue); }
        .bot-info { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); }
        .status-dot.Online { background: var(--accent-green); }
        .status-dot.Connecting { background: var(--accent-yellow); }
        .status-dot.Offline { background: var(--accent-red); }

        /* Konsol */
        .console-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .console-box { background-color: #050b14; border: 1px solid var(--border-color); border-radius: 6px; height: 450px; overflow-y: auto; padding: 12px; font-family: 'Courier New', Courier, monospace; font-size: 0.85rem; line-height: 1.4; }
        .log-entry { margin-bottom: 4px; word-break: break-word; }
        .log-tag { font-weight: bold; color: var(--accent-blue); margin-right: 5px; }
        .log-time { color: var(--text-muted); margin-right: 5px; font-size: 0.75rem; }

        /* Input Alani */
        .command-bar { display: flex; gap: 8px; margin-top: 10px; }
        .input-text { flex: 1; background: #050b14; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 6px; outline: none; }
        .input-select { background: #050b14; border: 1px solid var(--border-color); color: #fff; padding: 0 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sol Panel: Bot Yönetimi -->
        <div class="panel">
            <div class="panel-title">
                🤖 Bot Yöneticisi
            </div>

            <div class="global-actions">
                <button class="btn btn-green" onclick="startAll()">Tümünü Başlat</button>
                <button class="btn btn-red" onclick="stopAll()">Tümünü Durdur</button>
            </div>

            <div style="display: flex; gap: 5px; margin-bottom: 12px;">
                <input type="text" id="newBotName" class="input-text" placeholder="Yeni Bot Adı" style="padding: 6px;">
                <button class="btn btn-blue" onclick="addBot()">Ekle</button>
            </div>

            <div class="bot-list" id="botList">
                <!-- Bot Kartları Buraya Dinamik Gelecek -->
            </div>
        </div>

        <!-- Sağ Panel: Canlı Konsol -->
        <div class="panel">
            <div class="console-header">
                <span style="font-weight: 600;">💻 Canlı Konsol ve Sohbet</span>
                <select id="filterSelect" class="input-select" onchange="changeFilter()">
                    <option value="all">Tüm Botların Akışı</option>
                </select>
            </div>

            <div class="console-box" id="consoleBox">
                <!-- Loglar Buraya Akacak -->
            </div>

            <div class="command-bar">
                <select id="targetBotSelect" class="input-select">
                    <option value="all">Tüm Botlara Gönder</option>
                </select>
                <input type="text" id="cmdInput" class="input-text" placeholder="Komut veya mesaj yazın (Örn: /register deliyiz123)..." onkeypress="handleKeyPress(event)">
                <button class="btn btn-blue" onclick="sendCommand()">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let bots = [];
        let currentFilter = 'all';

        socket.on('init-data', (data) => {
            bots = data.botList;
            renderBotList();
            renderSelectOptions();
        });

        socket.on('bot-added', (botData) => {
            bots.push(botData);
            renderBotList();
            renderSelectOptions();
        });

        socket.on('status-update', ({ botId, status }) => {
            const bot = bots.find(b => b.id === botId);
            if (bot) {
                bot.status = status;
                renderBotList();
            }
        });

        socket.on('bot-log', (logData) => {
            // Logu ilgili bota kaydet
            const bot = bots.find(b => b.id === logData.botId);
            if (bot) {
                if (!bot.logs) bot.logs = [];
                bot.logs.push(logData);
            }

            // Ekrana ekle (Filtreye uygunsa)
            if (currentFilter === 'all' || currentFilter === logData.botId) {
                appendLogToConsole(logData);
            }
        });

        function renderBotList() {
            const listEl = document.getElementById('botList');
            listEl.innerHTML = '';

            bots.forEach(bot => {
                const item = document.createElement('div');
                item.className = 'bot-item';
                item.innerHTML = `
                    <div class="bot-info">
                        <div class="status-dot ${bot.status}"></div>
                        <span style="font-weight: 600;">${bot.username}</span>
                    </div>
                    <div>
                        ${bot.status === 'Offline' 
                            ? `<button class="btn btn-green" style="padding: 4px 8px; font-size:0.75rem;" onclick="startBot('${bot.id}')">Başlat</button>`
                            : `<button class="btn btn-red" style="padding: 4px 8px; font-size:0.75rem;" onclick="stopBot('${bot.id}')">Durdur</button>`
                        }
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function renderSelectOptions() {
            const filterSelect = document.getElementById('filterSelect');
            const targetSelect = document.getElementById('targetBotSelect');

            filterSelect.innerHTML = '<option value="all">Tüm Botların Akışı</option>';
            targetSelect.innerHTML = '<option value="all">Tüm Botlara Gönder</option>';

            bots.forEach(bot => {
                filterSelect.innerHTML += `<option value="${bot.id}">${bot.username} Konsolu</option>`;
                targetSelect.innerHTML += `<option value="${bot.id}">${bot.username}</option>`;
            });

            filterSelect.value = currentFilter;
        }

        function appendLogToConsole(logData) {
            const consoleBox = document.getElementById('consoleBox');
            const bot = bots.find(b => b.id === logData.botId);
            const botName = bot ? bot.username : logData.botId;

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="log-time">[${logData.timestamp}]</span>
                <span class="log-tag">[${botName}]</span>
                <span>${escapeHtml(logData.text)}</span>
            `;

            consoleBox.appendChild(entry);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function changeFilter() {
            currentFilter = document.getElementById('filterSelect').value;
            const consoleBox = document.getElementById('consoleBox');
            consoleBox.innerHTML = '';

            if (currentFilter === 'all') {
                // Tüm logları birleştirip zamana göre sırala
                let allLogs = [];
                bots.forEach(b => { if (b.logs) allLogs = allLogs.concat(b.logs); });
                allLogs.forEach(log => appendLogToConsole(log));
            } else {
                const selectedBot = bots.find(b => b.id === currentFilter);
                if (selectedBot && selectedBot.logs) {
                    selectedBot.logs.forEach(log => appendLogToConsole(log));
                }
            }
        }

        function startBot(id) { socket.emit('start-bot', id); }
        function stopBot(id) { socket.emit('stop-bot', id); }
        function startAll() { socket.emit('start-all'); }
        function stopAll() { socket.emit('stop-all'); }

        function addBot() {
            const input = document.getElementById('newBotName');
            if (input.value.trim()) {
                socket.emit('add-bot', input.value.trim());
                input.value = '';
            }
        }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            const target = document.getElementById('targetBotSelect').value;
            if (input.value.trim()) {
                socket.emit('send-command', { targetBotId: target, command: input.value.trim() });
                input.value = '';
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendCommand(); }
        function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    </script>
</body>
</html>
