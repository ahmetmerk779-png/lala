<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Bot Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card-box { background-color: #121826; border: 1px solid #1e293b; border-radius: 16px; }
        .radar-area { background-color: #070a12; background-image: radial-gradient(circle, rgba(239, 68, 68, 0.25) 1px, transparent 1px); background-size: 16px 16px; }
    </style>
</head>
<body class="p-3 max-w-md mx-auto space-y-4">

    <!-- ÜST BUTON -->
    <div class="flex gap-2">
        <button onclick="openAddModal()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl text-sm shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus"><span>YENİ BOT EKLE</span></i>
        </button>
    </div>

    <!-- BOT KARTLARI -->
    <div id="botListContainer" class="space-y-4"></div>

    <!-- BOT EKLEME MODALI (Tüm Detaylı Alanlar) -->
    <div id="addModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="card-box p-5 w-full max-w-sm space-y-3">
            <h3 class="font-bold text-base text-white border-b border-slate-800 pb-2">Yeni Bot Ekle</h3>
            
            <div class="space-y-1">
                <label class="text-[10px] text-slate-400 font-bold">Kullanıcı Adı</label>
                <input type="text" id="inpUser" placeholder="Bot Kullanıcı Adı" value="banyedin" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] text-slate-400 font-bold">Sunucu IP</label>
                <input type="text" id="inpHost" placeholder="oyna.aesirmc.com" value="oyna.aesirmc.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white font-mono">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div class="space-y-1">
                    <label class="text-[10px] text-slate-400 font-bold">Port</label>
                    <input type="text" id="inpPort" placeholder="25565" value="25565" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white font-mono">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] text-slate-400 font-bold">Sürüm</label>
                    <input type="text" id="inpVersion" placeholder="auto" value="auto" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white font-mono">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] text-slate-400 font-bold">Giriş Şifresi (/login varsa)</label>
                <input type="text" id="inpPass" placeholder="Opsiyonel şifre" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="closeAddModal()" class="flex-1 bg-slate-800 py-2.5 rounded-lg text-xs font-bold text-slate-300">İptal</button>
                <button onclick="addBotConfirm()" class="flex-1 bg-emerald-600 py-2.5 rounded-lg text-xs font-bold text-white">Oluştur</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let bots = [];

        socket.on('init-data', (data) => { bots = data.botList || []; renderUI(); });
        socket.on('bot-added', (bot) => { bots.push(bot); renderUI(); });
        socket.on('bot-updated', (updated) => {
            const idx = bots.findIndex(b => b.id === updated.id);
            if (idx !== -1) { bots[idx] = updated; renderBotCard(updated); }
            else renderUI();
        });

        socket.on('bot-log', (data) => {
            const bot = bots.find(b => b.id === data.botId);
            if (bot) {
                if (!bot.logs) bot.logs = [];
                bot.logs.push(data);
                if (bot.logs.length > 150) bot.logs.shift();
                const logBox = document.getElementById(`terminal_${data.botId}`);
                if (logBox) {
                    logBox.innerHTML += `<div class="text-slate-300"><span class="text-slate-500">[${data.timestamp}]</span> ${data.text}</div>`;
                    logBox.scrollTop = logBox.scrollHeight;
                }
            }
        });

        function renderUI() {
            const container = document.getElementById('botListContainer');
            if (bots.length === 0) {
                container.innerHTML = `<div class="card-box p-8 text-center text-slate-500 text-xs">Henüz bot eklenmedi.</div>`;
                return;
            }
            container.innerHTML = bots.map(b => getBotHTML(b)).join('');
            bots.forEach(b => drawRadar(b));
        }

        function renderBotCard(b) {
            const el = document.getElementById(`card_${b.id}`);
            if (el) { el.outerHTML = getBotHTML(b); drawRadar(b); }
            else renderUI();
        }

        function getBotHTML(b) {
            const tabRows = (b.tabList && b.tabList.length > 0) ? b.tabList.map(p => `
                <div class="flex justify-between items-center py-1 border-b border-slate-800/40 text-[11px]">
                    <span class="text-emerald-400 font-medium">${p.name}</span>
                    <span class="text-emerald-500 font-mono">${p.ping}ms</span>
                </div>`).join('') : '<div class="text-slate-500 text-[11px] italic py-2 text-center">Sunucuda oyuncu bulunamadı</div>';

            const sbRows = Object.entries(b.scoreboard?.items || {}).map(([k, v]) => `
                <div class="flex justify-between items-center py-0.5 text-[11px]">
                    <span class="text-slate-300">${k}</span>
                    <span class="text-rose-500 font-mono font-bold">${v}</span>
                </div>`).join('') || '<div class="text-slate-500 text-[11px] italic text-center py-2">Skor Verisi Yok</div>';

            const logsHtml = (b.logs || []).map(l => `<div class="text-slate-300"><span class="text-slate-500">[${l.timestamp}]</span> ${l.text}</div>`).join('');

            return `
            <div id="card_${b.id}" class="card-box p-3 space-y-3">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <img src="https://minotar.net/helm/${b.username}/32.png" class="w-8 h-8 rounded bg-slate-800">
                        <div>
                            <span class="font-bold text-white text-xs block">${b.username}</span>
                            <span class="text-[10px] text-slate-400">${b.status}</span>
                        </div>
                    </div>
                    <div class="flex gap-1.5">
                        ${b.status !== 'Online' ? 
                            `<button onclick="socket.emit('start-bot', '${b.id}')" class="bg-emerald-600 hover:bg-emerald-500 w-8 h-8 rounded-lg text-white text-xs"><i class="fa-solid fa-play"></i></button>` : 
                            `<button onclick="socket.emit('stop-bot', '${b.id}')" class="bg-rose-600 hover:bg-rose-500 w-8 h-8 rounded-lg text-white text-xs"><i class="fa-solid fa-square"></i></button>`
                        }
                        <button onclick="socket.emit('delete-bot', '${b.id}')" class="bg-slate-800 hover:bg-rose-900 w-8 h-8 rounded-lg text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>

                <!-- 1. 2D RADAR -->
                <div class="card-box p-2.5 bg-[#080c14] space-y-2">
                    <div class="flex justify-between items-center text-xs font-bold px-1">
                        <span class="text-cyan-400">🗺️ 2D Radar</span>
                        <span class="text-slate-400 text-[10px]">(Yakın Varlıklar)</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <canvas id="radar_${b.id}" width="240" height="130" class="radar-area rounded-lg w-full"></canvas>
                    </div>
                </div>

                <!-- 2. TAB OYUNCU LİSTESİ -->
                <div class="card-box p-3 bg-[#0c101c] space-y-1">
                    <div class="flex justify-between items-center text-xs font-bold border-b border-slate-800 pb-1.5 mb-1">
                        <span class="text-amber-400">📋 Tab Oyuncu Listesi</span>
                        <span class="text-slate-400 font-mono">${b.tabList?.length || 0} Oyuncu</span>
                    </div>
                    <div class="flex justify-between text-[10px] text-slate-500 font-bold px-1">
                        <span>Oyuncu</span><span>Ping</span>
                    </div>
                    <div class="max-h-36 overflow-y-auto space-y-0.5 pr-1">${tabRows}</div>
                </div>

                <!-- 3. SKOR TABLOSU -->
                <div class="card-box p-3 bg-[#0c101c] space-y-1">
                    <div class="text-center font-bold text-xs text-amber-400 border-b border-slate-800 pb-1.5 mb-1">
                        📊 ${b.scoreboard?.title || 'SKOR TABLOSU'}
                    </div>
                    <div class="space-y-0.5">${sbRows}</div>
                    <div class="text-[10px] text-slate-400 pt-2 border-t border-slate-800/60 font-mono text-center">
                        ${b.config?.host || 'OYNA.SUNUCU.COM'}
                    </div>
                </div>

                <!-- CANLI TERMINAL & KOMUT -->
                <div class="card-box p-2 bg-black/60 space-y-1">
                    <div id="terminal_${b.id}" class="h-28 overflow-y-auto font-mono text-[10px] space-y-0.5 p-1">
                        ${logsHtml || '<div class="text-slate-600">Terminal hazır...</div>'}
                    </div>
                    <div class="flex gap-1 pt-1">
                        <input type="text" id="cmd_${b.id}" placeholder="/komut yazın (örn: /gir asmp)..." onkeypress="if(event.key==='Enter') sendCmd('${b.id}')" class="flex-1 bg-slate-900 border border-slate-800 rounded px-2 py-1.5 text-[11px] text-white font-mono outline-none">
                        <button onclick="sendCmd('${b.id}')" class="bg-blue-600 px-3 py-1.5 rounded text-[11px] font-bold text-white">Gönder</button>
                    </div>
                </div>
            </div>`;
        }

        function drawRadar(bot) {
            const canvas = document.getElementById(`radar_${bot.id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#10b981';
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 5, 0, Math.PI * 2); ctx.fill();

            (bot.radarEntities || []).forEach(e => {
                const rx = (canvas.width / 2) + (e.x * 1.5);
                const rz = (canvas.height / 2) + (e.z * 1.5);
                if (rx >= 0 && rx <= canvas.width && rz >= 0 && rz <= canvas.height) {
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath(); ctx.arc(rx, rz, 3, 0, Math.PI * 2); ctx.fill();
                }
            });
        }

        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }
        
        function addBotConfirm() {
            const username = document.getElementById('inpUser').value.trim();
            const host = document.getElementById('inpHost').value.trim();
            const port = document.getElementById('inpPort').value.trim();
            const version = document.getElementById('inpVersion').value.trim();
            const password = document.getElementById('inpPass').value.trim();
            
            socket.emit('add-bot', { username, host, port, version, password });
            closeAddModal();
        }

        function sendCmd(botId) {
            const inp = document.getElementById(`cmd_${botId}`);
            if (inp && inp.value.trim()) {
                socket.emit('bot-command', { botId, command: inp.value.trim() });
                inp.value = '';
            }
        }
    </script>
</body>
</html>
