<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mineflayer Bot Kontrol Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Fira Code', 'Segoe UI', monospace; }
        body { background-color: #1e1e1e; color: #d4d4d4; padding: 15px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        h1 { color: #569cd6; font-size: 20px; margin-bottom: 15px; border-bottom: 1px solid #3c3c3c; padding-bottom: 8px; }
        
        .card { background: #252526; border: 1px solid #3c3c3c; padding: 15px; border-radius: 4px; margin-bottom: 15px; }
        .card h2 { font-size: 14px; margin-bottom: 10px; color: #4ec9b0; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 10px; }
        input, select { background: #1e1e1e; border: 1px solid #3c3c3c; color: #ce9178; padding: 8px 10px; border-radius: 2px; font-size: 13px; width: 100%; }
        input:focus, select:focus { outline: 1px solid #007acc; border-color: #007acc; }
        label { font-size: 11px; color: #808080; display: block; margin-bottom: 3px; }
        
        button { background: #0e639c; color: white; border: none; padding: 8px 12px; border-radius: 2px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.1s; }
        button:hover { background: #1177bb; }
        button.danger { background: #a31515; }
        button.danger:hover { background: #c72e2e; }
        button.success { background: #238636; }
        button.success:hover { background: #2ea043; }
        button.warning { background: #d7ba7d; color: #1e1e1e; }
        button.warning:hover { background: #c5a869; }

        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

        /* Konsol / Chat Alanı */
        .console-flex { display: flex; gap: 8px; }
        .console-flex select { width: 160px; flex-shrink: 0; }
        .console-flex input { flex-grow: 1; }

        /* Bot Listesi */
        .bot-card { background: #1e1e1e; border: 1px solid #3c3c3c; border-left: 4px solid #555; padding: 12px; border-radius: 3px; margin-bottom: 12px; }
        .bot-card.Online { border-left-color: #4ec9b0; }
        .bot-card.Connecting { border-left-color: #ce9178; }
        .bot-card.Offline { border-left-color: #f14c4c; }

        .bot-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        .bot-info { font-size: 13px; }
        .bot-info strong { color: #9cdcfe; font-size: 14px; }
        .badge { padding: 2px 6px; border-radius: 2px; font-size: 10px; font-weight: bold; }
        .badge.Online { background: #1b4b36; color: #4ec9b0; }
        .badge.Connecting { background: #4d3800; color: #ce9178; }
        .badge.Offline { background: #481414; color: #f14c4c; }

        /* Log Paneli */
        .log-box { background: #111; border: 1px solid #2d2d2d; height: 120px; overflow-y: auto; padding: 6px; font-size: 11px; border-radius: 2px; margin-top: 6px; margin-bottom: 6px; }
        .log-entry { margin-bottom: 2px; word-break: break-all; }
        .log-entry.chat { color: #d4d4d4; }
        .log-entry.command { color: #d7ba7d; font-weight: bold; }
        .log-entry.info { color: #569cd6; }
        .log-entry.success { color: #4ec9b0; }
        .log-entry.error { color: #f14c4c; }
        .log-entry.warn { color: #ce9178; }

        .bot-cmd-box { display: flex; gap: 6px; margin-top: 4px; }

        /* Ayar Modalı */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: #252526; border: 1px solid #3c3c3c; width: 90%; max-width: 480px; padding: 18px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .modal h3 { color: #569cd6; font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid #3c3c3c; padding-bottom: 6px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>> Mineflayer_Multi_Bot_Manager</h1>

        <!-- OYUN İÇİ SOHBET VE KOMUT KONSOLU -->
        <div class="card">
            <h2>💬 Oyun İçi Sohbet & Komut Konsolu</h2>
            <div class="console-flex">
                <select id="global-target">
                    <option value="all">Tüm Botlar (All)</option>
                </select>
                <input type="text" id="global-cmd-input" placeholder="Oyun içi mesaj veya komut yazın (Örn: /tpa nick, Sa, /sell all)..." onkeydown="if(event.key==='Enter') sendGlobalCommand()" />
                <button class="success" onclick="sendGlobalCommand()">Gönder</button>
            </div>
        </div>

        <!-- Bot Ekleme ve Toplu Kontrol -->
        <div class="card">
            <h2>[+] Bot Yönetimi</h2>
            <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                <input type="text" id="new-username" placeholder="Yeni Bot Kullanıcı Adı" onkeydown="if(event.key==='Enter') addBot()" />
                <button class="success" onclick="addBot()">Bot Ekle</button>
            </div>
            <div class="btn-group">
                <button class="success" onclick="socket.emit('start-all')">⚡ Tümünü Başlat</button>
                <button class="danger" onclick="socket.emit('stop-all')">🔴 Tümünü Durdur</button>
            </div>
        </div>

        <!-- Bot Listesi -->
        <div class="card">
            <h2>[=] Bot Listesi (<span id="bot-count">0</span>)</h2>
            <div id="bot-list">Botlar yükleniyor...</div>
        </div>
    </div>

    <!-- BOT AYARLARI MODALI -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h3>⚙️️ Bot Ayarları: <span id="modal-bot-name" style="color: #9cdcfe;"></span></h3>
            <input type="hidden" id="modal-bot-id" />
            
            <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                <div>
                    <label>Sunucu IP</label>
                    <input type="text" id="modal-host" placeholder="141.95.82.164" />
                </div>
                <div>
                    <label>Port</label>
                    <input type="number" id="modal-port" placeholder="25565" />
                </div>
            </div>

            <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                <div>
                    <label>Sürüm</label>
                    <input type="text" id="modal-version" placeholder="1.20.1" />
                </div>
                <div>
                    <label>Giriş/Kayıt Şifresi</label>
                    <input type="text" id="modal-password" placeholder="Şifre" />
                </div>
            </div>

            <div>
                <label>Alt Sunucu Komutu</label>
                <input type="text" id="modal-subcmd" placeholder="/server boxpvp" />
            </div>

            <div style="margin-top: 8px;">
                <label>Alt Sunucu Geçiş Gecikmesi (Saniye)</label>
                <input type="number" id="modal-delay" placeholder="3" value="3" />
            </div>

            <div class="modal-actions">
                <button class="danger" onclick="closeSettingsModal()">İptal</button>
                <button class="success" onclick="saveBotSettings()">💾 Ayarları Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let bots = [];

        socket.on('init-data', (data) => {
            bots = data.botList;
            renderBots();
            updateTargetDropdown();
        });

        socket.on('bot-added', (bot) => {
            bots.push(bot);
            renderBots();
            updateTargetDropdown();
        });

        socket.on('bot-deleted', (botId) => {
            bots = bots.filter(b => b.id !== botId);
            renderBots();
            updateTargetDropdown();
        });

        socket.on('status-update', ({ botId, status }) => {
            const bot = bots.find(b => b.id === botId);
            if (bot) {
                bot.status = status;
                renderBots();
            }
        });

        socket.on('bot-updated', ({ botId, config }) => {
            const index = bots.findIndex(b => b.id === botId);
            if (index !== -1) {
                bots[index] = { ...bots[index], ...config };
                renderBots();
                updateTargetDropdown();
            }
        });

        socket.on('bot-log', (log) => {
            const logBox = document.getElementById(`logs-${log.botId}`);
            if (logBox) {
                const entry = document.createElement('div');
                entry.className = `log-entry ${log.type}`;
                entry.innerText = `[${log.timestamp}] ${log.text}`;
                logBox.appendChild(entry);
                logBox.scrollTop = logBox.scrollHeight;
            }
        });

        function renderBots() {
            document.getElementById('bot-count').innerText = bots.length;
            const container = document.getElementById('bot-list');

            if (bots.length === 0) {
                container.innerHTML = '<p style="color:#777;">Kayıtlı bot bulunmuyor.</p>';
                return;
            }

            container.innerHTML = bots.map(b => `
                <div class="bot-card ${b.status}">
                    <div class="bot-header">
                        <div class="bot-info">
                            <strong>${b.username}</strong>
                            <span class="badge ${b.status}">${b.status}</span>
                            <div style="font-size: 11px; color: #808080; margin-top: 3px;">
                                IP: <span style="color:#ce9178;">${b.host}:${b.port}</span> | Şifre: <span style="color:#ce9178;">${b.autoPassword || 'Yok'}</span>
                            </div>
                        </div>
                        <div class="btn-group">
                            ${b.status === 'Offline' 
                                ? `<button class="success" onclick="socket.emit('start-bot', '${b.id}')">Başlat</button>`
                                : `<button class="danger" onclick="socket.emit('stop-bot', '${b.id}')">Durdur</button>`
                            }
                            <button class="warning" onclick="openSettingsModal('${b.id}')">⚙️ Ayarlar</button>
                            <button class="danger" onclick="socket.emit('delete-bot', '${b.id}')">Sil</button>
                        </div>
                    </div>

                    <!-- Canlı Sohbet ve Log Kutusu -->
                    <div class="log-box" id="logs-${b.id}">
                        ${(b.logs || []).map(l => `<div class="log-entry ${l.type}">[${l.timestamp}]${l.text}</div>`).join('')}
                    </div>

                    <!-- Bot Baza Özel Hızlı Komut/Sohbet Girişi -->
                    <div class="bot-cmd-box">
                        <input type="text" id="cmd-input-${b.id}" placeholder="${b.username} için mesaj/komut..." onkeydown="if(event.key==='Enter') sendBotCommand('${b.id}')" />
                        <button onclick="sendBotCommand('${b.id}')">Gönder</button>
                    </div>
                </div>
            `).join('');
        }

        function updateTargetDropdown() {
            const select = document.getElementById('global-target');
            const currentVal = select.value;
            select.innerHTML = '<option value="all">Tüm Botlar (All)</option>';
            
            bots.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b.id;
                opt.innerText = b.username;
                select.appendChild(opt);
            });

            select.value = currentVal || 'all';
        }

        // --- KOMUT GÖNDERME FONKSİYONLARI ---
        function sendGlobalCommand() {
            const input = document.getElementById('global-cmd-input');
            const targetBotId = document.getElementById('global-target').value;
            const command = input.value.trim();

            if (!command) return;

            socket.emit('send-command', { targetBotId, command });
            input.value = '';
        }

        function sendBotCommand(botId) {
            const input = document.getElementById(`cmd-input-${botId}`);
            if (!input) return;
            const command = input.value.trim();

            if (!command) return;

            socket.emit('send-command', { targetBotId: botId, command });
            input.value = '';
        }

        function addBot() {
            const usernameInput = document.getElementById('new-username');
            const username = usernameInput.value.trim();
            if (!username) return alert('Lütfen bir isim girin!');
            socket.emit('add-bot', username);
            usernameInput.value = '';
        }

        // --- MODAL YÖNETİMİ ---
        function openSettingsModal(botId) {
            const bot = bots.find(b => b.id === botId);
            if (!bot) return;

            document.getElementById('modal-bot-id').value = bot.id;
            document.getElementById('modal-bot-name').innerText = bot.username;
            document.getElementById('modal-host').value = bot.host || '';
            document.getElementById('modal-port').value = bot.port || 25565;
            document.getElementById('modal-version').value = bot.version || '';
            document.getElementById('modal-password').value = bot.autoPassword || '';
            document.getElementById('modal-subcmd').value = bot.autoSubServerCmd || '';
            document.getElementById('modal-delay').value = bot.autoSubServerDelay !== undefined ? bot.autoSubServerDelay : 3;

            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function saveBotSettings() {
            const botId = document.getElementById('modal-bot-id').value;
            const config = {
                host: document.getElementById('modal-host').value.trim(),
                port: parseInt(document.getElementById('modal-port').value) || 25565,
                version: document.getElementById('modal-version').value.trim() || false,
                autoPassword: document.getElementById('modal-password').value.trim(),
                autoSubServerCmd: document.getElementById('modal-subcmd').value.trim(),
                autoSubServerDelay: parseInt(document.getElementById('modal-delay').value) || 3
            };

            socket.emit('update-bot-config', { botId, config });
            closeSettingsModal();
        }
    </script>
</body>
</html>
