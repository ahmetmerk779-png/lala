<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced MC Bot Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#111827',
                        cardborder: '#1f2937',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
        .log-box { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-darkbg text-slate-200 min-h-screen pb-16 md:pb-6 text-xs select-none">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 glass-panel border-b border-cardborder px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-gamepad text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-white text-sm tracking-wide">MC PRO DASHBOARD</h1>
                    <div class="flex items-center gap-2 text-[10px] text-slate-400">
                        <span id="globalHostBadge" class="text-indigo-400">Sunucu: Yükleniyor...</span>
                        <span>•</span>
                        <span id="activeBotStats" class="text-emerald-400">0/0 Aktif</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-1.5">
                <button onclick="startAll()" class="px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 rounded-lg font-medium transition flex items-center gap-1.5 text-[11px]">
                    <i class="fa-solid fa-play"></i> <span class="hidden sm:inline">Tümünü Başlat</span>
                </button>
                <button onclick="stopAll()" class="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 rounded-lg font-medium transition flex items-center gap-1.5 text-[11px]">
                    <i class="fa-solid fa-square"></i> <span class="hidden sm:inline">Durdur</span>
                </button>
                <button onclick="openGlobalConfigModal()" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-cardborder transition">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN BODY -->
    <main class="max-w-7xl mx-auto p-3 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-4">

        <!-- SOL PANEL: BOT LİSTESİ -->
        <div class="lg:col-span-3 space-y-3">
            <div class="bg-cardbg border border-cardborder rounded-xl p-3">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Bot Listesi</span>
                    <button onclick="addBot()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-0.5 rounded transition flex items-center gap-1">
                        <i class="fa-solid fa-plus text-[10px]"></i> Yeni Bot
                    </button>
                </div>
                <div id="botListContainer" class="space-y-1.5 max-h-[380px] overflow-y-auto pr-1"></div>
            </div>

            <div id="quickControls" class="bg-cardbg border border-cardborder rounded-xl p-3 space-y-2 hidden">
                <span class="text-[11px] font-semibold text-indigo-400 uppercase tracking-wider block mb-1">Hızlı Modlar</span>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btnAutoReconnect" onclick="toggleAutoReconnect()" class="p-2 bg-darkbg border border-cardborder rounded-lg text-left transition hover:border-indigo-500">
                        <div class="text-[10px] text-slate-400">Oto-Yeniden Bağlan</div>
                        <div id="statusAutoReconnect" class="text-xs font-bold text-rose-400">Devre Dışı</div>
                    </button>
                    <button id="btnAntiAfk" onclick="toggleAntiAfk()" class="p-2 bg-darkbg border border-cardborder rounded-lg text-left transition hover:border-indigo-500">
                        <div class="text-[10px] text-slate-400">Anti-AFK Modu</div>
                        <div id="statusAntiAfk" class="text-xs font-bold text-rose-400">Devre Dışı</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- ORTA PANEL: KONSOL VE DURUM -->
        <div class="lg:col-span-6 space-y-3">
            
            <div class="bg-cardbg border border-cardborder rounded-xl p-3 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <img id="selectedBotHead" src="https://minotar.net/helm/Steve/32.png" class="w-8 h-8 rounded border border-cardborder">
                    <div>
                        <div class="flex items-center gap-2">
                            <span id="selectedBotTitle" class="font-bold text-white text-sm">Tüm Botlar</span>
                            <span id="selectedBotStatus" class="px-1.5 py-0.5 rounded text-[9px] font-medium bg-slate-800 text-slate-400">Offline</span>
                        </div>
                        <div id="selectedBotSub" class="text-[10px] text-slate-400">Versiyon: Global</div>
                    </div>
                </div>

                <div class="flex items-center gap-4 w-full sm:w-auto">
                    <div class="flex-1 sm:w-28 space-y-1">
                        <div class="flex justify-between text-[10px] text-slate-400">
                            <span>Can</span>
                            <span id="hpText" class="text-rose-400 font-bold">20/20</span>
                        </div>
                        <div class="w-full bg-darkbg h-2 rounded-full overflow-hidden border border-cardborder">
                            <div id="hpBar" class="bg-rose-500 h-full w-full transition-all duration-300"></div>
                        </div>
                    </div>
                    <div class="flex-1 sm:w-28 space-y-1">
                        <div class="flex justify-between text-[10px] text-slate-400">
                            <span>Açlık</span>
                            <span id="foodText" class="text-amber-400 font-bold">20/20</span>
                        </div>
                        <div class="w-full bg-darkbg h-2 rounded-full overflow-hidden border border-cardborder">
                            <div id="foodBar" class="bg-amber-500 h-full w-full transition-all duration-300"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- KONSOL -->
            <div class="bg-cardbg border border-cardborder rounded-xl p-3 flex flex-col h-[460px]">
                <div class="flex items-center justify-between pb-2 mb-2 border-b border-cardborder gap-2">
                    <div class="flex items-center gap-1 overflow-x-auto">
                        <button onclick="setLogFilter('all')" class="log-filter-btn px-2 py-0.5 rounded bg-indigo-600 text-white text-[10px]">Tümü</button>
                        <button onclick="setLogFilter('chat')" class="log-filter-btn px-2 py-0.5 rounded bg-slate-800 text-slate-400 hover:text-white text-[10px]">Sohbet</button>
                        <button onclick="setLogFilter('system')" class="log-filter-btn px-2 py-0.5 rounded bg-slate-800 text-slate-400 hover:text-white text-[10px]">Sistem</button>
                        <button onclick="setLogFilter('error')" class="log-filter-btn px-2 py-0.5 rounded bg-slate-800 text-slate-400 hover:text-white text-[10px]">Hatalar</button>
                    </div>
                    <button onclick="clearConsole()" class="p-1 text-slate-400 hover:text-rose-400 text-xs transition" title="Temizle"><i class="fa-solid fa-trash-can"></i></button>
                </div>

                <div id="logBox" class="log-box flex-1 bg-darkbg border border-cardborder rounded-lg p-2.5 overflow-y-auto space-y-1 text-slate-300">
                    <div class="text-slate-500 italic">[Sistem] Konsol dinleniyor...</div>
                </div>

                <div class="mt-2.5 flex gap-2">
                    <input type="text" id="cmdInput" placeholder="Komut veya mesaj gönder (örn: /gir asmp)..." onkeypress="if(event.key==='Enter') sendCommand()" class="flex-1 bg-darkbg border border-cardborder rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500 text-xs">
                    <button onclick="sendCommand()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium transition text-xs flex items-center gap-1">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>

        </div>

        <!-- SAĞ PANEL: RADAR & TAB -->
        <div class="lg:col-span-3 space-y-3">
            <div class="bg-cardbg border border-cardborder rounded-xl p-3">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Radar & Konum</span>
                    <span id="posBadge" class="text-[10px] text-indigo-400 font-mono">X:0 Y:0 Z:0</span>
                </div>
                <div class="flex justify-center relative">
                    <canvas id="radarCanvas" width="160" height="160" class="bg-darkbg border border-cardborder rounded-lg"></canvas>
                </div>
            </div>

            <div class="bg-cardbg border border-cardborder rounded-xl p-3">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Tab Listesi</span>
                    <span id="tabCount" class="text-[10px] text-slate-500">0 Oyuncu</span>
                </div>
                <div id="tablistContainer" class="bg-darkbg border border-cardborder rounded-lg p-2 max-h-40 overflow-y-auto space-y-1 text-[11px] text-slate-300">
                    <span class="text-slate-500 italic">Veri yok</span>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL -->
    <div id="globalConfigModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
        <div class="bg-cardbg border border-cardborder rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-cardborder pb-3">
                <h3 class="font-bold text-white text-sm flex items-center gap-2"><i class="fa-solid fa-sliders text-indigo-400"></i> Genel Sunucu Ayarları</h3>
                <button onclick="closeGlobalConfigModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1">Sunucu IP</label>
                    <input type="text" id="globalHost" class="w-full bg-darkbg border border-cardborder rounded-lg p-2 text-white">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-slate-400 block mb-1">Port</label>
                        <input type="number" id="globalPort" value="25565" class="w-full bg-darkbg border border-cardborder rounded-lg p-2 text-white">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">Minecraft Sürümü</label>
                        <select id="globalVersion" class="w-full bg-darkbg border border-cardborder rounded-lg p-2 text-white">
                            <option value="1.21.1">1.21.1</option>
                            <option value="1.21">1.21</option>
                            <option value="1.20.6">1.20.6</option>
                            <option value="1.20.4" selected>1.20.4</option>
                            <option value="1.20.1">1.20.1</option>
                            <option value="1.16.5">1.16.5</option>
                            <option value="1.12.2">1.12.2</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">Otomatik Lobi / Aktarma Komutu</label>
                    <input type="text" id="globalSubCmd" placeholder="/gir asmp" class="w-full bg-darkbg border border-cardborder rounded-lg p-2 text-white">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-cardborder">
                <button onclick="closeGlobalConfigModal()" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg">İptal</button>
                <button onclick="saveGlobalConfig()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let bots = [];
        let selectedBotId = 'all';
        let globalConfig = {};
        let activeLogFilter = 'all';

        socket.on('init-data', (data) => {
            globalConfig = data.globalConfig || {};
            bots = data.botList || [];
            
            document.getElementById('globalHost').value = globalConfig.host || '';
            document.getElementById('globalPort').value = globalConfig.port || 25565;
            document.getElementById('globalVersion').value = globalConfig.version || '1.20.4';
            document.getElementById('globalSubCmd').value = globalConfig.autoSubServerCmd || '';
            
            document.getElementById('globalHostBadge').innerText = `Sunucu: ${globalConfig.host || 'Tanımlanmadı'}`;
            renderBotList();
        });

        socket.on('bot-added', (bot) => { bots.push(bot); renderBotList(); });

        socket.on('status-update', ({ botId, status, health, food }) => {
            const bot = bots.find(b => b.id === botId);
            if (bot) {
                bot.status = status;
                if (health !== undefined) bot.health = health;
                if (food !== undefined) bot.food = food;
                renderBotList();
                if (selectedBotId === botId) updateBotHeader(bot);
            }
        });

        socket.on('bot-log', (log) => {
            if (selectedBotId === 'all' || selectedBotId === log.botId) appendLog(log);
        });

        socket.on('bot-tablist', ({ botId, players }) => {
            if (selectedBotId === botId) {
                document.getElementById('tabCount').innerText = `${players.length} Oyuncu`;
                document.getElementById('tablistContainer').innerHTML = players.map(p => 
                    `<div class="flex justify-between border-b border-cardborder/50 pb-0.5">
                        <span class="text-slate-300">${p.name}</span>
                        <span class="text-slate-500 font-mono">${p.ping}ms</span>
                    </div>`
                ).join('') || '<span class="text-slate-500">Veri yok</span>';
            }
        });

        socket.on('bot-map-update', ({ botId, pos }) => {
            if (selectedBotId === botId) {
                document.getElementById('posBadge').innerText = `X:${pos.x} Y:${pos.y} Z:${pos.z}`;
                drawRadar(pos);
            }
        });

        function renderBotList() {
            const container = document.getElementById('botListContainer');
            const activeCount = bots.filter(b => b.status === 'Online').length;
            document.getElementById('activeBotStats').innerText = `${activeCount}/${bots.length} Aktif`;

            let html = `
                <div onclick="selectBot('all')" class="p-2 rounded-lg border cursor-pointer transition flex items-center justify-between ${selectedBotId === 'all' ? 'bg-indigo-950/60 border-indigo-500 text-white' : 'bg-darkbg border-cardborder hover:border-slate-700'}">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-indigo-400"></i>
                        <span class="font-medium">Tüm Botlar (Toplu)</span>
                    </div>
                </div>
            `;

            bots.forEach(b => {
                const isSelected = selectedBotId === b.id;
                let statusBadge = b.status === 'Online' ? '<span class="w-2 h-2 rounded-full bg-emerald-400"></span>' :
                                 (b.status === 'Connecting' ? '<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>' : '<span class="w-2 h-2 rounded-full bg-slate-600"></span>');

                html += `
                    <div onclick="selectBot('${b.id}')" class="p-2 rounded-lg border cursor-pointer transition flex items-center justify-between ${isSelected ? 'bg-indigo-950/60 border-indigo-500' : 'bg-darkbg border-cardborder hover:border-slate-700'}">
                        <div class="flex items-center gap-2">
                            <img src="https://minotar.net/helm/${b.username}/20.png" onerror="this.src='https://minotar.net/helm/Steve/20.png'" class="w-5 h-5 rounded">
                            <div>
                                <div class="font-medium flex items-center gap-1.5 text-white">${b.username} ${statusBadge}</div>
                                <div class="text-[9px] text-slate-500">${b.status}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="event.stopPropagation(); startBot('${b.id}')" class="p-1 hover:text-emerald-400"><i class="fa-solid fa-play"></i></button>
                            <button onclick="event.stopPropagation(); stopBot('${b.id}')" class="p-1 hover:text-rose-400"><i class="fa-solid fa-square"></i></button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function selectBot(id) {
            selectedBotId = id;
            const quickControls = document.getElementById('quickControls');
            document.getElementById('logBox').innerHTML = '';

            if (id === 'all') {
                quickControls.classList.add('hidden');
                document.getElementById('selectedBotTitle').innerText = 'Tüm Botlar (Toplu)';
                document.getElementById('selectedBotStatus').innerText = 'Toplu Yönetim';
                document.getElementById('selectedBotHead').src = 'https://minotar.net/helm/Steve/32.png';
                updateHealthBars(20, 20);
            } else {
                quickControls.classList.remove('hidden');
                const bot = bots.find(b => b.id === id);
                if (bot) {
                    updateBotHeader(bot);
                    if (bot.logs) bot.logs.forEach(appendLog);
                    updateQuickControlsUI(bot);
                }
            }
            renderBotList();
        }

        function updateBotHeader(bot) {
            document.getElementById('selectedBotTitle').innerText = bot.username;
            document.getElementById('selectedBotStatus').innerText = bot.status;
            document.getElementById('selectedBotHead').src = `https://minotar.net/helm/${bot.username}/32.png`;
            document.getElementById('selectedBotSub').innerText = `Sürüm: ${bot.version || globalConfig.version || '1.20.4'}`;
            updateHealthBars(bot.health ?? 20, bot.food ?? 20);
        }

        function updateHealthBars(hp, food) {
            document.getElementById('hpText').innerText = `${hp}/20`;
            document.getElementById('foodText').innerText = `${food}/20`;
            document.getElementById('hpBar').style.width = `${(hp / 20) * 100}%`;
            document.getElementById('foodBar').style.width = `${(food / 20) * 100}%`;
        }

        function appendLog(log) {
            if (activeLogFilter !== 'all' && log.type !== activeLogFilter) return;

            const box = document.getElementById('logBox');
            const div = document.createElement('div');
            let color = 'text-slate-300';
            if (log.type === 'error') color = 'text-rose-400 font-medium';
            if (log.type === 'system') color = 'text-amber-400';
            if (log.type === 'chat') color = 'text-indigo-300';

            div.className = `${color} border-b border-cardborder/40 pb-0.5 flex gap-1.5`;
            div.innerHTML = `<span class="text-slate-500 shrink-0">[${log.timestamp}]</span> <span class="break-all">${escapeHtml(log.text)}</span>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function escapeHtml(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        function setLogFilter(filter) {
            activeLogFilter = filter;
            document.querySelectorAll('.log-filter-btn').forEach(btn => {
                btn.classList.replace('bg-indigo-600', 'bg-slate-800');
                btn.classList.replace('text-white', 'text-slate-400');
            });
            event.target.classList.replace('bg-slate-800', 'bg-indigo-600');
            event.target.classList.replace('text-slate-400', 'text-white');
            
            document.getElementById('logBox').innerHTML = '';
            if (selectedBotId !== 'all') {
                const bot = bots.find(b => b.id === selectedBotId);
                if (bot && bot.logs) bot.logs.forEach(appendLog);
            }
        }

        function clearConsole() { document.getElementById('logBox').innerHTML = ''; }
        function addBot() {
            const name = prompt('Bot Kullanıcı Adı:');
            if (name) socket.emit('add-bot', { username: name });
        }

        function startBot(id) { socket.emit('start-bot', id); }
        function stopBot(id) { socket.emit('stop-bot', id); }
        function startAll() { socket.emit('start-all'); }
        function stopAll() { socket.emit('stop-all'); }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            if (input.value.trim()) {
                socket.emit('send-command', { targetBotId: selectedBotId, command: input.value.trim() });
                input.value = '';
            }
        }

        function toggleAutoReconnect() {
            if (selectedBotId === 'all') return;
            const bot = bots.find(b => b.id === selectedBotId);
            if (bot) {
                bot.autoReconnect = !bot.autoReconnect;
                socket.emit('update-bot-config', { botId: bot.id, config: { autoReconnect: bot.autoReconnect } });
                updateQuickControlsUI(bot);
            }
        }

        function toggleAntiAfk() {
            if (selectedBotId === 'all') return;
            const bot = bots.find(b => b.id === selectedBotId);
            if (bot) {
                bot.antiAfk = !bot.antiAfk;
                socket.emit('update-bot-config', { botId: bot.id, config: { antiAfk: bot.antiAfk } });
                updateQuickControlsUI(bot);
            }
        }

        function updateQuickControlsUI(bot) {
            const recEl = document.getElementById('statusAutoReconnect');
            const afkEl = document.getElementById('statusAntiAfk');
            
            recEl.innerText = bot.autoReconnect ? 'Aktif' : 'Devre Dışı';
            recEl.className = `text-xs font-bold ${bot.autoReconnect ? 'text-emerald-400' : 'text-rose-400'}`;

            afkEl.innerText = bot.antiAfk ? 'Aktif' : 'Devre Dışı';
            afkEl.className = `text-xs font-bold ${bot.antiAfk ? 'text-emerald-400' : 'text-rose-400'}`;
        }

        function openGlobalConfigModal() { document.getElementById('globalConfigModal').classList.remove('hidden'); }
        function closeGlobalConfigModal() { document.getElementById('globalConfigModal').classList.add('hidden'); }
        
        function saveGlobalConfig() {
            const config = {
                host: document.getElementById('globalHost').value.trim(),
                port: Number(document.getElementById('globalPort').value),
                version: document.getElementById('globalVersion').value,
                autoSubServerCmd: document.getElementById('globalSubCmd').value.trim()
            };
            socket.emit('update-config', config);
            closeGlobalConfigModal();
        }

        function drawRadar(centerPos) {
            const canvas = document.getElementById('radarCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2, cy = canvas.height / 2;

            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(cx, cy, 30, 0, Math.PI * 2);
            ctx.arc(cx, cy, 60, 0, Math.PI * 2);
            ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
            ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
            ctx.stroke();

            ctx.fillStyle = '#6366f1';
            ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
        }
    </script>
</body>
</html>
