<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MC Bot Kontrol</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#111827',
                        cardborder: '#1f2937',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        .log-font { font-family: monospace; font-size: 11px; }
    </style>
</head>
<body class="bg-darkbg text-slate-200 min-h-screen p-3 text-xs select-none flex flex-col justify-between">

    <!-- ÜST BAR -->
    <header class="bg-cardbg border border-cardborder rounded-xl p-3 mb-3 flex items-center justify-between">
        <div>
            <h1 class="font-bold text-white text-sm flex items-center gap-2">
                <i class="fa-solid fa-robot text-indigo-400"></i> MC Bot Dashboard
            </h1>
            <div class="text-[10px] text-slate-400 mt-0.5" id="serverInfo">
                play.donutsmp.net • <span id="botCountBadge" class="text-emerald-400 font-bold">0 Bot</span>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button onclick="openConfigModal()" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center border border-slate-700">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button onclick="addBot()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg flex items-center gap-1">
                <i class="fa-solid fa-plus text-[10px]"></i> Bot
            </button>
        </div>
    </header>

    <!-- BOT SEÇİMİ VE DURUM KARTI -->
    <div class="bg-cardbg border border-cardborder rounded-xl p-3 mb-3">
        <!-- Bot Seçim Açılır Menüsü -->
        <div class="flex items-center gap-2 mb-3">
            <select id="botSelect" onchange="onBotSelectChange(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white font-bold text-xs focus:outline-none">
                <option value="">-- Bot Ekleyin / Seçin --</option>
            </select>
        </div>

        <!-- Aktif Bot Detayları -->
        <div class="flex items-center justify-between bg-slate-900/80 p-2.5 rounded-lg border border-slate-800">
            <div class="flex items-center gap-2.5">
                <img id="botAvatar" src="https://minotar.net/helm/Steve/32.png" class="w-8 h-8 rounded border border-slate-700">
                <div>
                    <div class="font-bold text-white text-xs flex items-center gap-1.5">
                        <span id="selectedBotName">Bot Seçilmedi</span>
                        <span id="selectedBotStatusBadge" class="text-[9px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-400 font-bold">OFFLINE</span>
                    </div>
                    <div class="text-[10px] text-slate-400 flex items-center gap-3 mt-0.5">
                        <span>❤️ <b id="hpText" class="text-white">20</b></span>
                        <span>🍖 <b id="foodText" class="text-white">20</b></span>
                    </div>
                </div>
            </div>

            <!-- Bot Aksiyon Butonları -->
            <div class="flex items-center gap-1.5">
                <button onclick="startSelectedBot()" class="w-8 h-8 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg font-bold flex items-center justify-center">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button onclick="stopSelectedBot()" class="w-8 h-8 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg font-bold flex items-center justify-center">
                    <i class="fa-solid fa-square"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- KONSOL ALANI -->
    <div class="bg-cardbg border border-cardborder rounded-xl p-3 flex-1 flex flex-col min-h-[300px]">
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
                <i class="fa-solid fa-terminal text-indigo-400"></i> Konsol / Sohbet
            </span>
            <button onclick="clearConsole()" class="text-slate-500 hover:text-rose-400 text-xs">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>

        <div id="logBox" class="log-font flex-1 bg-slate-950 border border-slate-900 rounded-lg p-2.5 overflow-y-auto space-y-1.5 min-h-[220px] max-h-[360px]">
            <div class="text-slate-600 italic">[Sistem] Lütfen listeden bir bot seçin...</div>
        </div>

        <!-- Komut Gönderme Kutusu -->
        <div class="mt-2 flex gap-1.5">
            <input type="text" id="cmdInput" placeholder="Mesaj veya komut yazın..." onkeypress="if(event.key==='Enter') sendCommand()" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500 text-xs font-mono">
            <button onclick="sendCommand()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-lg transition font-bold flex items-center justify-center">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </div>
    </div>

    <!-- SUNUCU AYARLARI MODAL -->
    <div id="configModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
        <div class="bg-cardbg rounded-2xl max-w-sm w-full p-4 space-y-3 border border-slate-700">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-white text-xs">Sunucu Ayarları</h3>
                <button onclick="closeConfigModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-2 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1">Sunucu IP</label>
                    <input type="text" id="globalHost" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-slate-400 block mb-1">Port</label>
                        <input type="number" id="globalPort" value="25565" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">Sürüm</label>
                        <select id="globalVersion" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono">
                            <option value="1.20.4">1.20.4</option>
                            <option value="1.20.6">1.20.6</option>
                            <option value="1.21">1.21</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">Oto Giriş Komutu</label>
                    <input type="text" id="globalSubCmd" placeholder="/gir asmp" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                <button onclick="closeConfigModal()" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg">İptal</button>
                <button onclick="saveConfig()" class="px-4 py-1.5 bg-indigo-600 text-white font-bold rounded-lg">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let bots = [];
        let selectedBotId = null;
        let globalConfig = {};

        socket.on('init-data', (data) => {
            globalConfig = data.globalConfig || {};
            bots = data.botList || [];
            
            document.getElementById('globalHost').value = globalConfig.host || '';
            document.getElementById('globalPort').value = globalConfig.port || 25565;
            document.getElementById('globalVersion').value = globalConfig.version || '1.20.4';
            document.getElementById('globalSubCmd').value = globalConfig.autoSubServerCmd || '';
            
            document.getElementById('serverInfo').innerText = `${globalConfig.host || 'play.donutsmp.net'}`;

            if (bots.length > 0 && !selectedBotId) {
                selectedBotId = bots[0].id;
            }
            updateBotSelectDropdown();
            updateSelectedBotCard();
        });

        socket.on('bot-added', (bot) => {
            bots.push(bot);
            if (!selectedBotId) selectedBotId = bot.id;
            updateBotSelectDropdown();
            updateSelectedBotCard();
        });

        socket.on('status-update', ({ botId, status, health, food }) => {
            const bot = bots.find(b => b.id === botId);
            if (bot) {
                bot.status = status;
                if (health !== undefined) bot.health = health;
                if (food !== undefined) bot.food = food;
                updateBotSelectDropdown();
                if (selectedBotId === botId) updateSelectedBotCard();
            }
        });

        socket.on('bot-log', (log) => {
            if (selectedBotId === log.botId) appendLog(log);
        });

        function updateBotSelectDropdown() {
            const select = document.getElementById('botSelect');
            document.getElementById('botCountBadge').innerText = `${bots.length} Bot`;

            if (bots.length === 0) {
                select.innerHTML = `<option value="">-- Bot Ekleyin --</option>`;
                return;
            }

            select.innerHTML = bots.map(b => 
                `<option value="${b.id}" ${b.id === selectedBotId ? 'selected' : ''}>
                    ${b.username} (${b.status})
                </option>`
            ).join('');
        }

        function onBotSelectChange(id) {
            if (!id) return;
            selectedBotId = id;
            document.getElementById('logBox').innerHTML = '';
            const bot = bots.find(b => b.id === id);
            if (bot && bot.logs) bot.logs.forEach(appendLog);
            updateSelectedBotCard();
        }

        function updateSelectedBotCard() {
            const bot = bots.find(b => b.id === selectedBotId);
            if (!bot) {
                document.getElementById('selectedBotName').innerText = 'Bot Yok';
                document.getElementById('selectedBotStatusBadge').innerText = 'OFFLINE';
                document.getElementById('selectedBotStatusBadge').className = 'text-[9px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-400 font-bold';
                document.getElementById('botAvatar').src = 'https://minotar.net/helm/Steve/32.png';
                document.getElementById('hpText').innerText = '20';
                document.getElementById('foodText').innerText = '20';
                return;
            }

            document.getElementById('selectedBotName').innerText = bot.username;
            document.getElementById('botAvatar').src = `https://minotar.net/helm/${bot.username}/32.png`;
            document.getElementById('hpText').innerText = bot.health ?? 20;
            document.getElementById('foodText').innerText = bot.food ?? 20;

            const badge = document.getElementById('selectedBotStatusBadge');
            badge.innerText = bot.status.toUpperCase();
            if (bot.status === 'Online') {
                badge.className = 'text-[9px] px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold';
            } else if (bot.status === 'Connecting') {
                badge.className = 'text-[9px] px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold';
            } else {
                badge.className = 'text-[9px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-400 font-bold';
            }
        }

        function appendLog(log) {
            const box = document.getElementById('logBox');
            const div = document.createElement('div');
            let badge = '<span class="text-indigo-400">[CHAT]</span>';
            if (log.type === 'error') badge = '<span class="text-rose-400 font-bold">[HATA]</span>';
            if (log.type === 'system') badge = '<span class="text-amber-400">[SİSTEM]</span>';

            div.className = `border-b border-slate-900/50 pb-0.5 flex gap-1.5 items-start text-slate-300`;
            div.innerHTML = `<span class="text-slate-600 font-mono shrink-0">${log.timestamp}</span> ${badge} <span class="break-all font-mono">${escapeHtml(log.text)}</span>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function escapeHtml(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
        function clearConsole() { document.getElementById('logBox').innerHTML = ''; }

        function addBot() { 
            const name = prompt('Bot Kullanıcı Adı:'); 
            if (name) socket.emit('add-bot', { username: name.trim() }); 
        }

        function startSelectedBot() { if (selectedBotId) socket.emit('start-bot', selectedBotId); }
        function stopSelectedBot() { if (selectedBotId) socket.emit('stop-bot', selectedBotId); }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            if (input.value.trim() && selectedBotId) {
                socket.emit('send-command', { targetBotId: selectedBotId, command: input.value.trim() });
                input.value = '';
            }
        }

        function openConfigModal() { document.getElementById('configModal').classList.remove('hidden'); }
        function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }
        
        function saveConfig() {
            const config = {
                host: document.getElementById('globalHost').value.trim(),
                port: Number(document.getElementById('globalPort').value),
                version: document.getElementById('globalVersion').value,
                autoSubServerCmd: document.getElementById('globalSubCmd').value.trim()
            };
            socket.emit('update-config', config);
            closeConfigModal();
        }
    </script>
</body>
</html>
