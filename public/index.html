<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Bot Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121214; color: #e1e1e6; padding: 15px; }
        h1, h2, h3 { color: #00b4d8; }
        .grid { display: grid; grid-template-columns: 280px 1fr 300px; gap: 15px; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        .card { background: #202024; border-radius: 8px; padding: 15px; border: 1fr solid #29292e; }
        .btn { background: #0077b6; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        .btn:hover { background: #0096c7; }
        .btn-danger { background: #e63946; }
        .btn-success { background: #38b000; }
        .bot-item { background: #29292e; padding: 10px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; border-left: 4px solid #6c757d; }
        .bot-item.Online { border-left-color: #38b000; }
        .bot-item.Connecting { border-left-color: #ffb703; }
        .bot-item.selected { background: #323238; }
        .log-box { background: #121214; height: 350px; overflow-y: auto; padding: 10px; font-family: monospace; border-radius: 6px; font-size: 13px; margin-top: 10px; }
        .log-entry { margin-bottom: 4px; word-break: break-all; }
        .log-info { color: #90e0ef; }
        .log-success { color: #52b788; }
        .log-warn { color: #ffb703; }
        .log-error { color: #e63946; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 10px; background: #121214; border: 1px solid #323238; color: white; border-radius: 4px; }
        .tab-list, .scoreboard-list { background: #121214; padding: 10px; border-radius: 6px; max-height: 200px; overflow-y: auto; font-size: 13px; }
        canvas { background: #121214; border-radius: 6px; display: block; margin: 0 auto; }
    </style>
</head>
<body>
    <h2 style="margin-bottom: 15px;">🤖 MC Bot Kontrol Paneli</h2>
    
    <div class="grid">
        <!-- SOL PANEL: BOT LİSTESİ VE EKLEME -->
        <div>
            <div class="card" style="margin-bottom: 15px;">
                <h3>Genel Ayarlar</h3>
                <label>Sunucu IP</label>
                <input type="text" id="globalHost" placeholder="play.donutsmp.net">
                <label>Varsayılan Komut</label>
                <input type="text" id="globalSubCmd" placeholder="/gir boxpvp">
                <button class="btn" onclick="updateGlobalConfig()">Ayarları Kaydet</button>
            </div>

            <div class="card">
                <h3>Bot Yönetimi</h3>
                <div style="display: flex; gap: 5px; margin: 10px 0;">
                    <button class="btn btn-success" onclick="startAll()">Tümünü Başlat</button>
                    <button class="btn btn-danger" onclick="stopAll()">Tümünü Durdur</button>
                </div>
                <input type="text" id="newBotName" placeholder="Yeni Bot İsmi">
                <button class="btn" onclick="addBot()">+ Bot Ekle</button>
                <div id="botListContainer" style="margin-top: 15px;"></div>
            </div>
        </div>

        <!-- ORTA PANEL: SOHBET & KONTROL -->
        <div>
            <div class="card">
                <h3 id="selectedBotTitle">Seçili Bot: Tüm Botlar</h3>
                
                <div style="display: flex; gap: 5px; margin: 10px 0;">
                    <button class="btn btn-success" onclick="startSelectedBot()">Başlat</button>
                    <button class="btn btn-danger" onclick="stopSelectedBot()">Durdur</button>
                    <button class="btn btn-danger" style="background:#6c757d;" onclick="deleteSelectedBot()">Sil</button>
                </div>

                <div class="log-box" id="logBox"></div>

                <div style="display: flex; gap: 5px; margin-top: 10px;">
                    <input type="text" id="cmdInput" placeholder="Komut veya mesaj yazın..." onkeypress="if(event.key==='Enter') sendCommand()">
                    <button class="btn" style="width: 100px; margin-top: 5px;" onclick="sendCommand()">Gönder</button>
                </div>
            </div>
        </div>

        <!-- SAĞ PANEL: TAB, SCOREBOARD VE RADAR -->
        <div>
            <div class="card" style="margin-bottom: 15px;">
                <h3>Radar (Konum)</h3>
                <canvas id="radarCanvas" width="220" height="220"></canvas>
            </div>

            <div class="card" style="margin-bottom: 15px;">
                <h3>Scoreboard</h3>
                <div class="scoreboard-list" id="scoreboardContainer">Veri Yok</div>
            </div>

            <div class="card">
                <h3>TabList</h3>
                <div class="tab-list" id="tablistContainer">Veri Yok</div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let bots = [];
        let selectedBotId = 'all';
        let globalConfig = {};

        socket.on('init-data', (data) => {
            globalConfig = data.globalConfig;
            bots = data.botList;
            document.getElementById('globalHost').value = globalConfig.host || '';
            document.getElementById('globalSubCmd').value = globalConfig.autoSubServerCmd || '';
            renderBotList();
        });

        socket.on('bot-added', (bot) => {
            bots.push(bot);
            renderBotList();
        });

        socket.on('bot-deleted', (botId) => {
            bots = bots.filter(b => b.id !== botId);
            if (selectedBotId === botId) selectBot('all');
            renderBotList();
        });

        socket.on('status-update', ({ botId, status }) => {
            const bot = bots.find(b => b.id === botId);
            if (bot) {
                bot.status = status;
                renderBotList();
            }
        });

        socket.on('bot-log', (log) => {
            if (selectedBotId === 'all' || selectedBotId === log.botId) {
                appendLog(log);
            }
        });

        socket.on('bot-tablist', ({ botId, players }) => {
            if (selectedBotId === botId) {
                const container = document.getElementById('tablistContainer');
                container.innerHTML = players.map(p => `<div>${p.name} (${p.ping}ms)</div>`).join('');
            }
        });

        socket.on('bot-scoreboard', ({ botId, scoreboard }) => {
            if (selectedBotId === botId) {
                const container = document.getElementById('scoreboardContainer');
                container.innerHTML = `<b>${scoreboard.title}</b><hr style="border-color:#323238; margin: 4px 0;">` + 
                    scoreboard.lines.map(l => `<div>${l.text}: <span style="color:#00b4d8">${l.score}</span></div>`).join('');
            }
        });

        socket.on('bot-map-update', ({ botId, pos, nearbyPlayers }) => {
            if (selectedBotId === botId) {
                drawRadar(pos, nearbyPlayers);
            }
        });

        function renderBotList() {
            const container = document.getElementById('botListContainer');
            let html = `<div class="bot-item ${selectedBotId === 'all' ? 'selected' : ''}" onclick="selectBot('all')">
                <b>[Tüm Botlar Toplu]</b>
            </div>`;

            bots.forEach(b => {
                html += `<div class="bot-item ${b.status} ${selectedBotId === b.id ? 'selected' : ''}" onclick="selectBot('${b.id}')">
                    <b>${b.username}</b> <br>
                    <small>Durum: ${b.status} | Pos: ${b.pos.x}, ${b.pos.y}, ${b.pos.z}</small>
                </div>`;
            });
            container.innerHTML = html;
        }

        function selectBot(id) {
            selectedBotId = id;
            const title = id === 'all' ? 'Tüm Botlar' : (bots.find(b => b.id === id)?.username || id);
            document.getElementById('selectedBotTitle').innerText = `Seçili Bot: ${title}`;
            document.getElementById('logBox').innerHTML = '';
            
            const bot = bots.find(b => b.id === id);
            if (bot && bot.logs) {
                bot.logs.forEach(appendLog);
            }
            renderBotList();
        }

        function appendLog(log) {
            const box = document.getElementById('logBox');
            const div = document.createElement('div');
            div.className = `log-entry log-${log.type}`;
            div.innerText = `[${log.timestamp}] ${log.text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function addBot() {
            const username = document.getElementById('newBotName').value.trim();
            if (username) {
                socket.emit('add-bot', { username });
                document.getElementById('newBotName').value = '';
            }
        }

        function startSelectedBot() {
            if (selectedBotId !== 'all') socket.emit('start-bot', selectedBotId);
        }

        function stopSelectedBot() {
            if (selectedBotId !== 'all') socket.emit('stop-bot', selectedBotId);
        }

        function deleteSelectedBot() {
            if (selectedBotId !== 'all') socket.emit('delete-bot', selectedBotId);
        }

        function startAll() { socket.emit('start-all'); }
        function stopAll() { socket.emit('stop-all'); }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            const command = input.value.trim();
            if (command) {
                socket.emit('send-command', { targetBotId: selectedBotId, command });
                input.value = '';
            }
        }

        function updateGlobalConfig() {
            const host = document.getElementById('globalHost').value.trim();
            const autoSubServerCmd = document.getElementById('globalSubCmd').value.trim();
            socket.emit('update-config', { host, autoSubServerCmd });
            alert('Ayarlar kaydedildi!');
        }

        function drawRadar(centerPos, players) {
            const canvas = document.getElementById('radarCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Merkez (Bot)
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.fillStyle = '#00b4d8';
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, Math.PI * 2);
            ctx.fill();

            // Etraftaki Oyuncular
            ctx.fillStyle = '#e63946';
            players.forEach(p => {
                const dx = (p.x - centerPos.x) * 3;
                const dz = (p.z - centerPos.z) * 3;
                if (Math.abs(dx) < 100 && Math.abs(dz) < 100) {
                    ctx.beginPath();
                    ctx.arc(cx + dx, cy + dz, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
    </script>
</body>
</html>
