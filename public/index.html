<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Bot Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        bordercolor: '#334155'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .log-box { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="bg-darkbg text-slate-200 min-h-screen p-3 md:p-6 text-sm">

    <!-- ÜST BAŞLIK & GENEL AKSİYONLAR -->
    <header class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-bordercolor">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-robot text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">Minecraft Bot Paneli</h1>
                <p class="text-xs text-slate-400">Canlı Bot ve Sunucu Yönetimi</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
            <button onclick="startAll()" class="flex-1 md:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/20">
                <i class="fa-solid fa-play"></i> Tümünü Başlat
            </button>
            <button onclick="stopAll()" class="flex-1 md:flex-none px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-medium transition flex items-center justify-center gap-2 shadow-lg shadow-rose-900/20">
                <i class="fa-solid fa-square"></i> Tümünü Durdur
            </button>
        </div>
    </header>

    <!-- ANA İÇERİK GRID -->
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- SOL PANEL: BOT LİSTESİ & AYARLAR (4 KOLON) -->
        <div class="lg:col-span-4 space-y-4">
            
            <!-- YENİ BOT EKLEME -->
            <div class="bg-cardbg border border-bordercolor rounded-xl p-4 shadow-sm">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-indigo-400"></i> Yeni Bot Ekle
                </h2>
                <div class="flex gap-2">
                    <input type="text" id="newBotName" placeholder="Bot Kullanıcı Adı" class="flex-1 bg-darkbg border border-bordercolor rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                    <button onclick="addBot()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium transition">Ekle</button>
                </div>
            </div>

            <!-- BOT LİSTESİ -->
            <div class="bg-cardbg border border-bordercolor rounded-xl p-4 shadow-sm">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 flex items-center justify-between">
                    <span><i class="fa-solid fa-server text-indigo-400"></i> Botlar</span>
                    <span id="activeBotCount" class="bg-indigo-950 text-indigo-300 text-[10px] px-2 py-0.5 rounded-full border border-indigo-800">0/0 Aktif</span>
                </h2>
                <div id="botListContainer" class="space-y-2 max-h-[450px] overflow-y-auto pr-1">
                    <!-- Botlar JS ile buraya dolacak -->
                </div>
            </div>

            <!-- GENEL SUNUCU AYARLARI -->
            <div class="bg-cardbg border border-bordercolor rounded-xl p-4 shadow-sm">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-indigo-400"></i> Sunucu Bağlantı Ayarları
                </h2>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Hedef Sunucu (IP)</label>
                        <input type="text" id="globalHost" placeholder="play.donutsmp.net" class="w-full bg-darkbg border border-bordercolor rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Giriş / Alt Sunucu Komutu</label>
                        <input type="text" id="globalSubCmd" placeholder="/gir boxpvp" class="w-full bg-darkbg border border-bordercolor rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <button onclick="updateGlobalConfig()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-medium transition border border-slate-600">
                        Ayarları Kaydet
                    </button>
                </div>
            </div>

        </div>

        <!-- ORTA PANEL: SOHBET, LOG & KOMUT (5 KOLON) -->
        <div class="lg:col-span-5 space-y-4">
            
            <div class="bg-cardbg border border-bordercolor rounded-xl p-4 shadow-sm flex flex-col h-[680px]">
                
                <!-- SEÇİLİ BOT BAŞLIĞI -->
                <div class="flex items-center justify-between pb-3 border-b border-bordercolor mb-3">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
                        <h2 id="selectedBotTitle" class="font-bold text-white text-base">Tüm Botlar (Toplu)</h2>
                    </div>
                    <div class="flex gap-2" id="singleBotControls">
                        <button onclick="startSelectedBot()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs rounded transition"><i class="fa-solid fa-play"></i></button>
                        <button onclick="stopSelectedBot()" class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white text-xs rounded transition"><i class="fa-solid fa-square"></i></button>
                        <button onclick="deleteSelectedBot()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs rounded transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>

                <!-- LOG EKRANI -->
                <div id="logBox" class="log-box flex-1 bg-darkbg border border-bordercolor rounded-lg p-3 overflow-y-auto space-y-1.5 text-xs text-slate-300">
                    <div class="text-slate-500 italic">[Sistem] Konsol dinleniyor...</div>
                </div>

                <!-- KOMUT / SOHBET GİRDİSİ -->
                <div class="mt-3 flex gap-2">
                    <input type="text" id="cmdInput" placeholder="Komut veya mesaj yazın..." onkeypress="if(event.key==='Enter') sendCommand()" class="flex-1 bg-darkbg border border-bordercolor rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                    <button onclick="sendCommand()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium transition flex items-center gap-1">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>

            </div>

        </div>

        <!-- SAĞ PANEL: TABLIST, SCOREBOARD & RADAR (3 KOLON) -->
        <div class="lg:col-span-3 space-y-4">
            
            <!-- RADAR -->
            <div class="bg-cardbg border border-bordercolor rounded-xl p-4 shadow-sm">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 flex items-center justify-between">
                    <span><i class="fa-solid fa-compass text-indigo-400"></i> Radar</span>
                    <span id="posBadge" class="text-[10px] text-slate-400 font-mono">X:0 Y:0 Z:0</span>
                </h2>
                <div class="flex justify-center">
                    <canvas id="radarCanvas" width="200" height="200" class="bg-darkbg border border-bordercolor rounded-lg"></canvas>
                </div>
            </div>

            <!-- SCOREBOARD -->
            <div class="bg-cardbg border border-bordercolor rounded-xl p-4 shadow-sm">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-400"></i> Scoreboard
                </h2>
                <div id="scoreboardContainer" class="bg-darkbg border border-bordercolor rounded-lg p-3 max-h-40 overflow-y-auto text-xs text-slate-300">
                    <span class="text-slate-500">Veri yok</span>
                </div>
            </div>

            <!-- TABLIST -->
            <div class="bg-cardbg border border-bordercolor rounded-xl p-4 shadow-sm">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-users text-indigo-400"></i> Tab Listesi
                </h2>
                <div id="tablistContainer" class="bg-darkbg border border-bordercolor rounded-lg p-3 max-h-40 overflow-y-auto text-xs text-slate-300 space-y-1">
                    <span class="text-slate-500">Veri yok</span>
                </div>
            </div>

        </div>

    </div>

    <!-- CLIENT SCRIPT -->
    <script>
        const socket = io();
        let bots = [];
        let selectedBotId = 'all';
        let globalConfig = {};

        // SÜRE BİÇİMLENDİRME (SAAT : DAKİKA : SANİYE)
        function formatDuration(ms) {
            if (!ms) return '00:00:00';
            const totalSeconds = Math.floor((Date.now() - ms) / 1000);
            if (totalSeconds < 0) return '00:00:00';
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return [hours, minutes, seconds].map(v => v < 10 ? '0' + v : v).join(':');
        }

        // DÜZENLİ SÜRE GÜNCELLEMESİ (HER SANİYE)
        setInterval(() => {
            bots.forEach(bot => {
                if (bot.status === 'Online' && bot.onlineSince) {
                    const timerEl = document.getElementById(`timer-${bot.id}`);
                    if (timerEl) {
                        timerEl.innerText = formatDuration(bot.onlineSince);
                    }
                }
            });
        }, 1000);

        socket.on('init-data', (data) => {
            globalConfig = data.globalConfig || {};
            bots = data.botList || [];
            document.getElementById('globalHost').value = globalConfig.host || '';
            document.getElementById('globalSubCmd').value = globalConfig.autoSubServerCmd || '';
            renderBotList();
        });

        socket.on('bot-added', (bot) => {
            bots.push(bot);
            renderBotList();
        });

        socket.on('bot-deleted', (botId) => {
            bots = bots.filter(b => b.id !== botId);
            if (selectedBotId === botId) selectBot('all');
            renderBotList();
        });

        socket.on('status-update', ({ botId, status, onlineSince }) => {
            const bot = bots.find(b => b.id === botId);
            if (bot) {
                bot.status = status;
                bot.onlineSince = onlineSince;
                renderBotList();
            }
        });

        socket.on('bot-log', (log) => {
            if (selectedBotId === 'all' || selectedBotId === log.botId) {
                appendLog(log);
            }
        });

        socket.on('bot-tablist', ({ botId, players }) => {
            if (selectedBotId === botId) {
                const container = document.getElementById('tablistContainer');
                container.innerHTML = players.map(p => `<div class="flex justify-between border-b border-bordercolor/50 pb-0.5"><span>${p.name}</span><span class="text-slate-500">${p.ping}ms</span></div>`).join('');
            }
        });

        socket.on('bot-scoreboard', ({ botId, scoreboard }) => {
            if (selectedBotId === botId) {
                const container = document.getElementById('scoreboardContainer');
                container.innerHTML = `<div class="font-bold text-indigo-400 mb-1">${scoreboard.title}</div>` + 
                    scoreboard.lines.map(l => `<div class="flex justify-between text-[11px]"><span>${l.text}</span><span class="text-amber-400">${l.score}</span></div>`).join('');
            }
        });

        socket.on('bot-map-update', ({ botId, pos, nearbyPlayers }) => {
            if (selectedBotId === botId) {
                document.getElementById('posBadge').innerText = `X:${pos.x} Y:${pos.y} Z:${pos.z}`;
                drawRadar(pos, nearbyPlayers);
            }
        });

        function renderBotList() {
            const container = document.getElementById('botListContainer');
            const activeCount = bots.filter(b => b.status === 'Online').length;
            document.getElementById('activeBotCount').innerText = `${activeCount}/${bots.length} Aktif`;

            let html = `
                <div onclick="selectBot('all')" class="p-3 rounded-lg border cursor-pointer transition flex items-center justify-between ${selectedBotId === 'all' ? 'bg-indigo-950/60 border-indigo-500 text-white' : 'bg-darkbg border-bordercolor hover:border-slate-600'}">
                    <div class="flex items-center gap-2.5">
                        <i class="fa-solid fa-layer-group text-indigo-400"></i>
                        <span class="font-medium">Tüm Botlar (Toplu)</span>
                    </div>
                </div>
            `;

            bots.forEach(b => {
                const isSelected = selectedBotId === b.id;
                let statusBadge = '';
                let timerDisplay = 'Offline';

                if (b.status === 'Online') {
                    statusBadge = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>';
                    timerDisplay = `<span id="timer-${b.id}" class="font-mono text-emerald-400">${formatDuration(b.onlineSince)}</span>`;
                } else if (b.status === 'Connecting') {
                    statusBadge = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>';
                    timerDisplay = '<span class="text-amber-400">Bağlanıyor...</span>';
                } else {
                    statusBadge = '<span class="w-2 h-2 rounded-full bg-slate-500"></span>';
                    timerDisplay = '<span class="text-slate-500">Kapalı</span>';
                }

                html += `
                    <div onclick="selectBot('${b.id}')" class="p-3 rounded-lg border cursor-pointer transition flex items-center justify-between ${isSelected ? 'bg-indigo-950/60 border-indigo-500' : 'bg-darkbg border-bordercolor hover:border-slate-600'}">
                        <div class="flex items-center gap-2.5">
                            <img src="https://minotar.net/helm/${b.username}/24.png" onerror="this.src='https://minotar.net/helm/Steve/24.png'" class="w-6 h-6 rounded">
                            <div>
                                <div class="font-medium flex items-center gap-1.5 text-white">
                                    ${b.username}
                                    ${statusBadge}
                                </div>
                                <div class="text-[10px] text-slate-400 flex items-center gap-2 mt-0.5">
                                    <span><i class="fa-solid fa-clock text-slate-500"></i> ${timerDisplay}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function selectBot(id) {
            selectedBotId = id;
            const title = id === 'all' ? 'Tüm Botlar (Toplu)' : (bots.find(b => b.id === id)?.username || id);
            document.getElementById('selectedBotTitle').innerText = title;
            document.getElementById('logBox').innerHTML = '';
            
            const bot = bots.find(b => b.id === id);
            if (bot && bot.logs) {
                bot.logs.forEach(appendLog);
            }
            renderBotList();
        }

        function appendLog(log) {
            const box = document.getElementById('logBox');
            const div = document.createElement('div');
            
            let color = 'text-slate-300';
            if (log.type === 'error') color = 'text-rose-400';
            if (log.type === 'warn') color = 'text-amber-400';
            if (log.type === 'success') color = 'text-emerald-400';

            div.className = `${color} leading-relaxed border-b border-slate-800/40 pb-0.5`;
            div.innerHTML = `<span class="text-slate-500">[${log.timestamp}]</span> ${escapeHtml(log.text)}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function addBot() {
            const input = document.getElementById('newBotName');
            const username = input.value.trim();
            if (username) {
                socket.emit('add-bot', { username });
                input.value = '';
            }
        }

        function startSelectedBot() { if (selectedBotId !== 'all') socket.emit('start-bot', selectedBotId); }
        function stopSelectedBot() { if (selectedBotId !== 'all') socket.emit('stop-bot', selectedBotId); }
        function deleteSelectedBot() { if (selectedBotId !== 'all') socket.emit('delete-bot', selectedBotId); }

        function startAll() { socket.emit('start-all'); }
        function stopAll() { socket.emit('stop-all'); }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            const command = input.value.trim();
            if (command) {
                socket.emit('send-command', { targetBotId: selectedBotId, command });
                input.value = '';
            }
        }

        function updateGlobalConfig() {
            const host = document.getElementById('globalHost').value.trim();
            const autoSubServerCmd = document.getElementById('globalSubCmd').value.trim();
            socket.emit('update-config', { host, autoSubServerCmd });
        }

        function drawRadar(centerPos, players) {
            const canvas = document.getElementById('radarCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Arka plan ızgarası
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
            ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
            ctx.stroke();

            // Merkez Bot
            ctx.fillStyle = '#6366f1';
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fill();

            // Oyuncular
            ctx.fillStyle = '#f43f5e';
            players.forEach(p => {
                const dx = (p.x - centerPos.x) * 2;
                const dz = (p.z - centerPos.z) * 2;
                if (Math.abs(dx) < 90 && Math.abs(dz) < 90) {
                    ctx.beginPath();
                    ctx.arc(cx + dx, cy + dz, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
    </script>
</body>
</html>
