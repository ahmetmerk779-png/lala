<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Bot Panel & Auto Market</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b0f17;
            --bg-card: #151c28;
            --bg-input: #1e293b;
            --border-color: #27354a;
            --accent-primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 12px; font-size: 14px; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); padding: 14px 16px; border-radius: 12px; }
        .header h1 { font-size: 16px; font-weight: 700; background: linear-gradient(135deg, #a5b4fc, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25); }
        .card-header { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
        .form-group { display: flex; gap: 8px; }
        input, select, textarea { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 12px; border-radius: 8px; font-size: 13px; outline: none; width: 100%; }
        button { border: none; padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; color: #fff; }
        .btn-primary { background: var(--accent-primary); }
        .btn-success { background: #059669; }
        .btn-warning { background: #d97706; }
        .btn-danger { background: #dc2626; }
        .btn-secondary { background: #334155; color: var(--text-main); }
        .bot-card { background: #0f172a; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
        .bot-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .bot-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .bot-name { font-weight: 700; font-size: 15px; color: #f1f5f9; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
        .badge-Online { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-Offline { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-Connecting { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .coords-badge { font-family: 'Fira Code', monospace; font-size: 11px; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 3px 8px; border-radius: 6px; }
        .uptime-badge { font-family: 'Fira Code', monospace; font-size: 11px; color: #c084fc; background: rgba(192, 132, 252, 0.1); padding: 3px 8px; border-radius: 6px; }
        .log-box { background: #020617; border: 1px solid #1e293b; height: 110px; overflow-y: auto; padding: 8px; font-family: 'Fira Code', monospace; font-size: 11px; border-radius: 6px; margin-bottom: 10px; }
        .log-line { margin-bottom: 3px; word-break: break-all; }
        .log-info { color: #38bdf8; } .log-success { color: #4ade80; } .log-warn { color: #fbbf24; } .log-error { color: #f87171; } .log-chat { color: #e879f9; } .log-command { color: #a7f3d0; font-weight: bold; }
        .inventory-wrapper { background: #090d16; border: 1px solid #1e293b; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
        .armor-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #1e293b; }
        .inv-slot { background: #111827; border: 1px solid #1f293d; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; position: relative; border-radius: 6px; cursor: pointer; user-select: none; }
        .inv-slot.has-item { background: #1e293b; border-color: #3b82f6; }
        .inv-slot img { width: 26px; height: 26px; image-rendering: pixelated; object-fit: contain; pointer-events: none; }
        .inv-slot-count { position: absolute; bottom: 1px; right: 3px; color: #facc15; font-weight: 800; font-size: 10px; text-shadow: 1px 1px 2px #000; pointer-events: none; }
        .inv-slot-id { opacity: 0.2; font-size: 9px; color: #64748b; pointer-events: none; }
        .inv-info-bar { margin-top: 8px; background: #0f172a; border: 1px solid #1e293b; padding: 6px 10px; border-radius: 6px; font-size: 11px; display: flex; align-items: center; justify-content: space-between; }
        .bot-widgets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
        .radar-box { background: #090d16; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .radar-canvas { background: #020617; border: 1px solid #1e293b; border-radius: 8px; width: 100%; max-width: 220px; height: 220px; }
        .tablist-box { background: #090d16; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; }
        .tablist-container { max-height: 190px; overflow-y: auto; }
        .tablist-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .tablist-table th, .tablist-table td { padding: 4px 6px; border-bottom: 1px dashed #1e293b; }
        .scoreboard-box { background: #090d16; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; font-family: 'Fira Code', monospace; }
        .scoreboard-title { text-align: center; font-weight: bold; color: #facc15; border-bottom: 1px solid #1e293b; padding-bottom: 6px; margin-bottom: 8px; font-size: 12px; }
        .scoreboard-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; font-size: 11px; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 15px; }
        .modal { background: var(--bg-card); border: 1px solid var(--border-color); width: 100%; max-width: 400px; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🤖 MC Bot Manager & Auto Market</h1>
        <button class="btn-secondary" onclick="openGlobalSettings()">⚙️ Genel Ayarlar</button>
    </div>

    <div class="card">
        <div class="card-header">💬 Konsol & Komut Gönderimi</div>
        <div class="form-group">
            <select id="targetBotSelect" style="max-width: 130px;">
                <option value="all">Tüm Botlar</option>
            </select>
            <input type="text" id="globalCmdInput" placeholder="Komut yazın..." style="flex: 1;">
            <button class="btn-primary" onclick="sendGlobalCommand()">Gönder</button>
        </div>
    </div>

    <div class="card">
        <div class="card-header">➕ Bot Yönetimi</div>
        <div class="form-group" style="margin-bottom: 10px;">
            <input type="text" id="newBotUsername" placeholder="Yeni Bot Kullanıcı Adı" style="flex: 1;">
            <button class="btn-success" onclick="addBot()">Ekle</button>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-success" style="flex: 1;" onclick="socket.emit('start-all')">⚡ Tümünü Başlat</button>
            <button class="btn-danger" style="flex: 1;" onclick="socket.emit('stop-all')">🛑 Tümünü Durdur</button>
        </div>
    </div>

    <div class="card">
        <div class="card-header">📋 Aktif Bot Listesi</div>
        <div id="botListContainer"></div>
    </div>
</div>

<!-- Gelişmiş Bot Ayarları Modalı -->
<div class="modal-overlay" id="botSettingsModal">
    <div class="modal">
        <div class="modal-title" style="font-weight: bold; color: #a5b4fc;">⚙️ Bot Ayarları (<span id="modalBotName"></span>)</div>
        <input type="hidden" id="modalBotId">
        <div class="field"><label>Sunucu IP</label><input type="text" id="modalHost"></div>
        <div class="field"><label>Port</label><input type="number" id="modalPort"></div>
        <div class="field"><label>Versiyon</label><input type="text" id="modalVersion"></div>
        <div class="field"><label>Şifre (/login)</label><input type="text" id="modalPassword"></div>
        <div class="field"><label>Alt Sunucu Komutu</label><input type="text" id="modalSubCmd"></div>
        
        <hr style="border-color: #27354a; margin: 4px 0;">
        <div style="font-size: 11px; font-weight: bold; color: #facc15;">💎 Otomatik Ürün / Kristal Alımı</div>
        <div class="field" style="flex-direction: row; align-items: center; gap: 8px;">
            <input type="checkbox" id="modalAutoBuyEnabled" style="width: auto;">
            <label for="modalAutoBuyEnabled" style="cursor: pointer; color: #4ade80;">Otomatik Satın Almayı Etkinleştir</label>
        </div>
        <div class="field"><label>Hedef Kristal Miktarı</label><input type="number" id="modalTargetCrystal" placeholder="örn. 1300"></div>
        <div class="field"><label>1. Aşama Kategori Slotu (/shop)</label><input type="number" id="modalCategorySlot" placeholder="örn. 7"></div>
        <div class="field"><label>2. Aşama Ürün Slotu</label><input type="number" id="modalItemSlot" placeholder="örn. 3"></div>
        <div class="field"><label>3. Aşama Onay/Satın Al Slotu</label><input type="number" id="modalConfirmSlot" placeholder="örn. 22"></div>
        
        <div style="display: flex; gap: 8px; margin-top: 8px;">
            <button class="btn-primary" style="flex: 1;" onclick="saveBotSettings()">Kaydet</button>
            <button class="btn-secondary" onclick="closeModal('botSettingsModal')">İptal</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="globalSettingsModal">
    <div class="modal">
        <div class="modal-title" style="font-weight: bold; color: #a5b4fc;">🌐 Genel Varsayılan Ayarlar</div>
        <div class="field"><label>IP</label><input type="text" id="gModalHost"></div>
        <div class="field"><label>Port</label><input type="number" id="gModalPort"></div>
        <div class="field"><label>Versiyon</label><input type="text" id="gModalVersion"></div>
        <div class="field"><label>Şifre</label><input type="text" id="gModalPassword"></div>
        <div class="field"><label>Alt Sunucu Komutu</label><input type="text" id="gModalSubCmd"></div>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
            <button class="btn-primary" style="flex: 1;" onclick="saveGlobalSettings()">Kaydet</button>
            <button class="btn-secondary" onclick="closeModal('globalSettingsModal')">Kapat</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="botWindowModal">
    <div class="modal" style="max-width: 450px;">
        <div class="modal-title" id="windowModalTitle" style="color: #facc15; font-size: 13px; font-weight: bold;">📋 Sunucu Menüsü</div>
        <div id="windowModalContent" style="display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: #090d16; padding: 10px; border-radius: 8px; max-height: 320px; overflow-y: auto;"></div>
        <button class="btn-secondary" onclick="closeModal('botWindowModal')">Menüyü Kapat</button>
    </div>
</div>

<script>
    const socket = io();
    let botsMap = new Map();
    let globalConfig = {};

    function formatUptime(ms) {
        if (!ms) return '00:00:00';
        const totalSeconds = Math.floor((Date.now() - ms) / 1000);
        if (totalSeconds < 0) return '00:00:00';
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return [hours, minutes, seconds].map(v => v.toString().padStart(2, '0')).join(':');
    }

    setInterval(() => {
        botsMap.forEach((bot, botId) => {
            const uptimeEl = document.getElementById(`uptime-${botId}`);
            if (uptimeEl) {
                uptimeEl.innerText = (bot.status === 'Online' && bot.onlineSince) ? `⏱️ ${formatUptime(bot.onlineSince)}` : `⏱️ 00:00:00`;
            }
        });
    }, 1000);

    socket.on('init-data', (data) => {
        botsMap.clear();
        globalConfig = data.globalConfig || {};
        data.botList.forEach(bot => botsMap.set(bot.id, bot));
        renderBotList();
    });

    socket.on('bot-added', (bot) => { botsMap.set(bot.id, bot); renderBotList(); });
    socket.on('bot-deleted', (botId) => { botsMap.delete(botId); renderBotList(); });
    socket.on('bot-updated', ({ botId, config }) => {
        if (botsMap.has(botId)) { Object.assign(botsMap.get(botId), config); renderBotList(); }
    });
    socket.on('config-updated', (cfg) => { globalConfig = cfg; });

    socket.on('status-update', ({ botId, status, onlineSince }) => {
        if (botsMap.has(botId)) {
            const bot = botsMap.get(botId);
            bot.status = status;
            if (onlineSince !== undefined) bot.onlineSince = onlineSince;
            const badge = document.getElementById(`badge-${botId}`);
            if (badge) { badge.innerText = status; badge.className = `badge badge-${status}`; }
        }
    });

    socket.on('bot-log', (log) => {
        if (botsMap.has(log.botId)) {
            const bot = botsMap.get(log.botId);
            bot.logs.push(log);
            if (bot.logs.length > 20) bot.logs.shift();
            const logBox = document.getElementById(`logs-${log.botId}`);
            if (logBox) {
                const div = document.createElement('div');
                div.className = `log-line log-${log.type}`;
                div.innerText = `[${log.timestamp}] ${log.text}`;
                logBox.appendChild(div);
                logBox.scrollTop = logBox.scrollHeight;
            }
        }
    });

    socket.on('bot-inventory', ({ botId, inventory }) => {
        if (botsMap.has(botId)) { botsMap.get(botId).inventory = inventory; renderInventoryGrid(botId, inventory); }
    });

    socket.on('bot-map-update', ({ botId, pos, entities }) => {
        if (botsMap.has(botId)) {
            const bot = botsMap.get(botId);
            bot.pos = pos; bot.entities = entities;
            const coordsEl = document.getElementById(`coords-${botId}`);
            if (coordsEl) coordsEl.innerText = `📍 X: ${pos.x} | Y: ${pos.y} | Z: ${pos.z}`;
            drawTacticalRadar(botId, pos, entities);
        }
    });

    socket.on('bot-tablist', ({ botId, players }) => {
        if (botsMap.has(botId)) { botsMap.get(botId).tabList = players; renderTabList(botId, players); }
    });

    socket.on('bot-scoreboard', ({ botId, scoreboard }) => {
        const titleEl = document.getElementById(`sb-title-${botId}`);
        const linesEl = document.getElementById(`sb-lines-${botId}`);
        if (!linesEl) return;
        if (!scoreboard || !scoreboard.lines || scoreboard.lines.length === 0) {
            if (titleEl) titleEl.innerText = '📊 Scoreboard';
            linesEl.innerHTML = `<div style="color: #64748b; text-align: center;">Aktif Scoreboard yok</div>`;
            return;
        }
        if (titleEl && scoreboard.title) titleEl.innerText = `📊 ${scoreboard.title}`;
        linesEl.innerHTML = scoreboard.lines.map(item => `
            <div class="scoreboard-line">
                <span style="color:#e2e8f0;">${item.text}</span>
                <span style="color:#ef4444; font-weight:bold;">${item.score}</span>
            </div>
        `).join('');
    });

    socket.on('bot-open-window', ({ botId, windowId, title, slots }) => {
        const modal = document.getElementById('botWindowModal');
        document.getElementById('windowModalTitle').innerText = `📋 ${title || 'Sunucu Menüsü'}`;
        modal.style.display = 'flex';
        modal.dataset.botId = botId;
        modal.dataset.windowId = windowId;

        const content = document.getElementById('windowModalContent');
        content.innerHTML = '';
        for (let i = 0; i < slots; i++) {
            const slotEl = document.createElement('div');
            slotEl.className = 'inv-slot';
            slotEl.id = `win-slot-${windowId}-${i}`;
            slotEl.innerHTML = `<span class="inv-slot-id">${i}</span>`;
            content.appendChild(slotEl);
        }
    });

    socket.on('bot-window-items', ({ botId, windowId, items }) => {
        const modal = document.getElementById('botWindowModal');
        if (modal.style.display === 'flex' && modal.dataset.windowId == windowId) {
            Object.keys(items).forEach(slotIdx => {
                const item = items[slotIdx];
                const slotEl = document.getElementById(`win-slot-${windowId}-${slotIdx}`);
                if (slotEl && item) {
                    slotEl.className = 'inv-slot has-item';
                    const itemImg = `https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/${item.name}.png`;
                    slotEl.innerHTML = `
                        <img src="${itemImg}" onerror="this.style.display='none'" alt="${item.displayName}">
                        <span class="inv-slot-count">${item.count > 1 ? item.count : ''}</span>
                    `;
                    slotEl.title = item.displayName;
                    slotEl.onclick = () => {
                        socket.emit('click-window-slot', { botId, windowId, slot: slotIdx });
                    };
                }
            });
        }
    });

    function renderBotList() {
        const container = document.getElementById('botListContainer');
        const select = document.getElementById('targetBotSelect');
        container.innerHTML = '';
        select.innerHTML = '<option value="all">Tüm Botlar</option>';

        botsMap.forEach((bot) => {
            const opt = document.createElement('option');
            opt.value = bot.id; opt.innerText = bot.username;
            select.appendChild(opt);

            const pos = bot.pos || { x: 0, y: 0, z: 0 };
            const initialUptime = (bot.status === 'Online' && bot.onlineSince) ? formatUptime(bot.onlineSince) : '00:00:00';

            const card = document.createElement('div');
            card.className = 'bot-card';
            card.innerHTML = `
                <div class="bot-top">
                    <div class="bot-title">
                        <span class="bot-name">${bot.username}</span>
                        <span id="badge-${bot.id}" class="badge badge-${bot.status}">${bot.status}</span>
                        <span class="uptime-badge" id="uptime-${bot.id}">⏱️ ${initialUptime}</span>
                        <span class="coords-badge" id="coords-${bot.id}">📍 X: ${pos.x} | Y: ${pos.y} | Z: ${pos.z}</span>
                    </div>
                    <div style="display:flex; gap:4px;">
                        <button class="btn-success" onclick="socket.emit('start-bot', '${bot.id}')">Başlat</button>
                        <button class="btn-warning" onclick="socket.emit('stop-bot', '${bot.id}')">Durdur</button>
                        <button class="btn-secondary" onclick="openBotSettings('${bot.id}')">⚙</button>
                        <button class="btn-danger" onclick="socket.emit('delete-bot', '${bot.id}')">X</button>
                    </div>
                </div>
                <div class="log-box" id="logs-${bot.id}">
                    ${(bot.logs || []).map(l => `<div class="log-line log-${l.type}">[${l.timestamp}]${l.text}</div>`).join('')}
                </div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <input type="text" id="cmd-${bot.id}" placeholder="Özel komut gönder..." style="flex: 1;">
                    <button class="btn-primary" onclick="sendSingleCommand('${bot.id}')">Gönder</button>
                </div>
                <div class="inventory-wrapper">
                    <div class="inventory-header" style="font-size:12px; color:#a5b4fc; font-weight:700; margin-bottom:8px;">🎒 Envanter Görünümü</div>
                    <div class="armor-grid" id="armor-grid-${bot.id}"></div>
                    <div class="inventory-grid" id="inv-grid-${bot.id}"></div>
                    <div class="inv-info-bar" id="inv-info-${bot.id}"><span style="color:#64748b;">Eşyaya tıklayın veya sürükleyin</span></div>
                </div>
                <div class="bot-widgets-grid">
                    <div class="radar-box">
                        <div style="font-size:12px; color:#a5b4fc; font-weight:700; margin-bottom:8px; width:100%;">📡 Taktiksel Çevre Monitörü</div>
                        <canvas id="map-canvas-${bot.id}" class="radar-canvas" width="220" height="220"></canvas>
                    </div>
                    <div class="tablist-box">
                        <div style="font-size:12px; color:#a5b4fc; font-weight:700; margin-bottom:8px;">📋 Tab Listesi</div>
                        <div class="tablist-container"><table class="tablist-table"><tbody id="tab-body-${bot.id}"><tr><td style="color:#64748b;">Bekleniyor...</td></tr></tbody></table></div>
                    </div>
                    <div class="scoreboard-box">
                        <div class="scoreboard-title" id="sb-title-${bot.id}">📊 Scoreboard</div>
                        <div id="sb-lines-${bot.id}"><div style="color: #64748b; text-align: center;">Bekleniyor...</div></div>
                    </div>
                </div>
            `;
            container.appendChild(card);
            renderInventoryGrid(bot.id, bot.inventory || {});
            drawTacticalRadar(bot.id, pos, bot.entities || []);
            renderTabList(bot.id, bot.tabList || []);
            const lb = document.getElementById(`logs-${bot.id}`);
            if (lb) lb.scrollTop = lb.scrollHeight;
        });
    }

    function drawTacticalRadar(botId, pos, entities) {
        const canvas = document.getElementById(`map-canvas-${botId}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2, scale = 4;
        ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.1)';
        ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
        if (Array.isArray(entities)) {
            entities.forEach(ent => {
                const rx = cx + (ent.x - pos.x) * scale;
                const ry = cy + (ent.z - pos.z) * scale;
                if (rx >= 0 && rx <= w && ry >= 0 && ry <= h) {
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(rx, ry, 4, 0, Math.PI * 2); ctx.fill();
                }
            });
        }
        ctx.fillStyle = '#10b981'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
    }

    function renderTabList(botId, players) {
        const tbody = document.getElementById(`tab-body-${botId}`);
        if (!tbody) return;
        if (!players || players.length === 0) {
            tbody.innerHTML = `<tr><td style="color:#64748b;">Oyuncu yok</td></tr>`;
            return;
        }
        tbody.innerHTML = Object.values(players).map(p => `<tr><td><b>${p.displayName || p.name}</b></td><td style="text-align:right; color:#10b981;">${p.ping}ms</td></tr>`).join('');
    }

    function renderInventoryGrid(botId, inventory) {
        const grid = document.getElementById(`inv-grid-${botId}`);
        const armorGrid = document.getElementById(`armor-grid-${botId}`);
        if (!grid || !armorGrid) return;
        grid.innerHTML = ''; armorGrid.innerHTML = '';

        [5, 6, 7, 8, 45].forEach(slotId => {
            const item = inventory[slotId];
            armorGrid.appendChild(createSlotElement(botId, slotId, item));
        });

        for (let i = 9; i <= 44; i++) {
            grid.appendChild(createSlotElement(botId, i, inventory[i]));
        }
    }

    function createSlotElement(botId, slotIndex, item) {
        const slot = document.createElement('div');
        slot.className = item ? 'inv-slot has-item' : 'inv-slot';
        if (item) {
            const imgUrl = `https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/${item.name}.png`;
            slot.innerHTML = `<img src="${imgUrl}" onerror="this.style.display='none'" alt=""><span class="inv-slot-count">${item.count > 1 ? item.count : ''}</span>`;
            slot.title = item.displayName;
            slot.onclick = () => {
                document.getElementById(`inv-info-${botId}`).innerHTML = `<span style="color:#38bdf8;"><b>${item.displayName}</b> (${item.count} adet) - Slot: ${slotIndex}</span>`;
            };
        } else {
            slot.innerHTML = `<span class="inv-slot-id">${slotIndex}</span>`;
        }
        return slot;
    }

    function openBotSettings(botId) {
        const bot = botsMap.get(botId);
        if (!bot) return;

        document.getElementById('modalBotId').value = bot.id;
        document.getElementById('modalBotName').innerText = bot.username;
        document.getElementById('modalHost').value = bot.host || globalConfig.host || '';
        document.getElementById('modalPort').value = bot.port || globalConfig.port || 25565;
        document.getElementById('modalVersion').value = bot.version || globalConfig.version || '';
        document.getElementById('modalPassword').value = bot.autoPassword !== undefined ? bot.autoPassword : (globalConfig.autoPassword || '');
        document.getElementById('modalSubCmd').value = bot.autoSubServerCmd !== undefined ? bot.autoSubServerCmd : (globalConfig.autoSubServerCmd || '');

        const buyCfg = bot.autoBuyConfig || { enabled: false, targetCrystal: 1300, categorySlot: 7, itemSlot: 3, confirmSlot: 22 };
        document.getElementById('modalAutoBuyEnabled').checked = buyCfg.enabled || false;
        document.getElementById('modalTargetCrystal').value = buyCfg.targetCrystal || 1300;
        document.getElementById('modalCategorySlot').value = buyCfg.categorySlot !== undefined ? buyCfg.categorySlot : 7;
        document.getElementById('modalItemSlot').value = buyCfg.itemSlot !== undefined ? buyCfg.itemSlot : 3;
        document.getElementById('modalConfirmSlot').value = buyCfg.confirmSlot !== undefined ? buyCfg.confirmSlot : 22;

        document.getElementById('botSettingsModal').style.display = 'flex';
    }

    function saveBotSettings() {
        const botId = document.getElementById('modalBotId').value;
        const config = {
            host: document.getElementById('modalHost').value.trim(),
            port: Number(document.getElementById('modalPort').value),
            version: document.getElementById('modalVersion').value.trim(),
            autoPassword: document.getElementById('modalPassword').value.trim(),
            autoSubServerCmd: document.getElementById('modalSubCmd').value.trim(),
            autoBuyConfig: {
                enabled: document.getElementById('modalAutoBuyEnabled').checked,
                targetCrystal: Number(document.getElementById('modalTargetCrystal').value),
                categorySlot: Number(document.getElementById('modalCategorySlot').value),
                itemSlot: Number(document.getElementById('modalItemSlot').value),
                confirmSlot: Number(document.getElementById('modalConfirmSlot').value)
            }
        };

        socket.emit('update-bot-config', { botId, config });
        closeModal('botSettingsModal');
    }

    function openGlobalSettings() {
        document.getElementById('gModalHost').value = globalConfig.host || '';
        document.getElementById('gModalPort').value = globalConfig.port || 25565;
        document.getElementById('gModalVersion').value = globalConfig.version || '';
        document.getElementById('gModalPassword').value = globalConfig.autoPassword || '';
        document.getElementById('gModalSubCmd').value = globalConfig.autoSubServerCmd || '';
        document.getElementById('globalSettingsModal').style.display = 'flex';
    }

    function saveGlobalSettings() {
        const newConfig = {
            host: document.getElementById('gModalHost').value.trim(),
            port: Number(document.getElementById('gModalPort').value),
            version: document.getElementById('gModalVersion').value.trim(),
            autoPassword: document.getElementById('gModalPassword').value.trim(),
            autoSubServerCmd: document.getElementById('gModalSubCmd').value.trim()
        };
        socket.emit('update-config', newConfig);
        closeModal('globalSettingsModal');
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function addBot() {
        const input = document.getElementById('newBotUsername');
        if (input.value.trim()) { socket.emit('add-bot', { username: input.value.trim() }); input.value = ''; }
    }
    function sendGlobalCommand() {
        const target = document.getElementById('targetBotSelect').value;
        const cmd = document.getElementById('globalCmdInput').value;
        if (cmd.trim()) { socket.emit('send-command', { targetBotId: target, command: cmd.trim() }); document.getElementById('globalCmdInput').value = ''; }
    }
    function sendSingleCommand(botId) {
        const input = document.getElementById(`cmd-${botId}`);
        if (input && input.value.trim()) { socket.emit('send-command', { targetBotId: botId, command: input.value.trim() }); input.value = ''; }
    }
</script>
</body>
</html>
